name: Add AdSense to Arcade Atlas pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-adsense-pages.yml"

permissions:
  contents: write

jobs:
  add-adsense:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add the Arcade Atlas AdSense tag to site and game entry pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          excluded_dirs = {".git", ".github", "duckmath-site", "static", "cloudflare", "neon", "supabase"}
          targets = set(Path(".").glob("*.html"))
          for path in Path(".").glob("*/index.html"):
              if path.parts[0] not in excluded_dirs:
                  targets.add(path)
          targets.add(Path("g/index.html"))
          targets.update(Path("g").glob("*/index.html"))

          publisher = "ca-pub-8390067368864065"
          tag = (
              f'<meta name="google-adsense-account" content="{publisher}">'
              f'\n<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={publisher}" '
              'crossorigin="anonymous"></script>'
          )

          changed = []
          skipped_existing = []
          skipped_no_head = []
          for path in sorted(targets):
              if not path.is_file():
                  continue
              raw = path.read_bytes()
              text = raw.decode("utf-8")
              if "adsbygoogle.js" in text.lower():
                  skipped_existing.append(str(path))
                  continue
              match = re.search(r"<head\\b[^>]*>", text, flags=re.IGNORECASE)
              if not match:
                  skipped_no_head.append(str(path))
                  continue
              newline = "\\r\\n" if "\\r\\n" in text else "\\n"
              insertion = newline + tag.replace("\\n", newline)
              updated = text[:match.end()] + insertion + text[match.end():]
              path.write_bytes(updated.encode("utf-8"))
              changed.append(str(path))

          print(f"Updated {len(changed)} pages.")
          print(f"Already had an AdSense script (left unchanged): {len(skipped_existing)}.")
          print(f"No head element (left unchanged): {len(skipped_no_head)}.")
          with open("/tmp/adsense-pages.txt", "w") as report:
              report.write("\\n".join(changed))

          if changed:
              with open("/tmp/adsense-summary.txt", "w") as report:
                  report.write(
                      f"Added Arcade Atlas AdSense code to {len(changed)} site/game entry pages. "
                      f"Left {len(skipped_existing)} pages with existing AdSense scripts unchanged."
                  )
          PY

      - name: Commit the page updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'g/*/index.html' 'g/index.html'
          if git diff --cached --quiet; then
            echo "No HTML pages needed AdSense updates."
            exit 0
          fi
          git commit -m "Add AdSense to Arcade Atlas site and game pages"
          git push origin main
