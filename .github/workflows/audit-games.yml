name: Audit Arcade Atlas games

on:
  push:
    branches: [main]
    paths:
      - "games.json"
      - "g/**"
      - "duckmath-site/**"
      - "scripts/audit-games.mjs"
      - "leaderboard/index.html"
      - "js/timeTracker.js"
      - ".github/workflows/audit-games.yml"
  workflow_dispatch:

concurrency:
  group: arcade-atlas-game-audit
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 30
    steps:
      # Browser smoke tests also validate locally imported GitHub games.
      - name: Check out Arcade Atlas
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          mkdir -p /tmp/arcade-web
          ln -s "$GITHUB_WORKSPACE" /tmp/arcade-web/ToTuff4U
          cd /tmp/arcade-web
          python3 -m http.server 4173 > /tmp/arcade-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ToTuff4U/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/arcade-server.log
          exit 1
      - name: Audit Arcade Atlas games in Chromium
        run: node scripts/audit-games.mjs
      - name: Commit verified game catalog cleanup
        if: success()
        run: |
          if git diff --quiet -- games.json duckmath-site/disabled-games.json; then
            echo "No new verified DuckMath games to add."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json duckmath-site/disabled-games.json
          git commit -m "Add verified DuckMath games to Arcade Atlas"
          git pull --rebase origin main
          git push
      - name: Upload browser audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-atlas-game-audit
          path: arcade-atlas-game-audit.json
          if-no-files-found: ignore
      - name: Remove temporary audit report from site files
        if: success()
        run: rm -rf arcade-atlas-game-audit.json node_modules package-lock.json
      - name: Upload GitHub Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy updated Arcade Atlas
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
