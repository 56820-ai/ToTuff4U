name: Import 50 kid-friendly games

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-kid-games.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcade-atlas-kid-game-import
  cancel-in-progress: false

jobs:
  import-games:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Arcade Atlas
        uses: actions/checkout@v4

      - name: Download and install 50 games from GitHub
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          source_dir="$tmp/crisp-game-lib-games"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/abagames/crisp-game-lib-games.git "$source_dir"
          cd "$source_dir"
          git sparse-checkout set --no-cone \
            'LICENSE.txt' 'README.md' 'docs/index.html' \
        'docs/tappump/**' \
        'docs/gpress/**' \
        'docs/portalj/**' \
        'docs/circlew/**' \
        'docs/revolvea/**' \
        'docs/mrider/**' \
        'docs/tlanes/**' \
        'docs/holes/**' \
        'docs/flipo/**' \
        'docs/thanoi/**' \
        'docs/sumten/**' \
        'docs/ttfence/**' \
        'docs/ctower/**' \
        'docs/growth/**' \
        'docs/geocent/**' \
        'docs/bsfish/**' \
        'docs/gtail/**' \
        'docs/breedc/**' \
        'docs/kite/**' \
        'docs/intow/**' \
        'docs/snaky/**' \
        'docs/wiper/**' \
        'docs/rwheel/**' \
        'docs/zoomio/**' \
        'docs/numberline/**' \
        'docs/lineb/**' \
        'docs/makemaze/**' \
        'docs/squarebar/**' \
        'docs/teeter/**' \
        'docs/reflector/**' \
        'docs/liftup/**' \
        'docs/rps/**' \
        'docs/numberball/**' \
        'docs/mirrorfloor/**' \
        'docs/crossline/**' \
        'docs/subjump/**' \
        'docs/scaffold/**' \
        'docs/aerialbar/**' \
        'docs/pinclimb/**' \
        'docs/parking/**' \
        'docs/balance/**' \
        'docs/bamboo/**' \
        'docs/froooog/**' \
        'docs/findastar/**' \
        'docs/pairsdrop/**' \
        'docs/cardq/**' \
        'docs/shiny/**' \
        'docs/floater/**' \
        'docs/hoppingp/**' \
        'docs/updownpress/**'
          source_commit="$(git rev-parse HEAD)"
          cd "$GITHUB_WORKSPACE"

          mkdir -p g/one-button-collection
          cp "$source_dir/docs/index.html" g/one-button-collection/index.html
          cp "$source_dir/LICENSE.txt" g/one-button-collection/LICENSE.txt
          cp "$source_dir/README.md" g/one-button-collection/README-UPSTREAM.md

          cat > "$RUNNER_TEMP/games-additions.json" <<'GAMES'
[
  {
    "title": "Tap Pump",
    "slug": "tappump"
  },
  {
    "title": "G Press",
    "slug": "gpress"
  },
  {
    "title": "Portal Jump",
    "slug": "portalj"
  },
  {
    "title": "Circle W",
    "slug": "circlew"
  },
  {
    "title": "Revolve A",
    "slug": "revolvea"
  },
  {
    "title": "M Rider",
    "slug": "mrider"
  },
  {
    "title": "T Lanes",
    "slug": "tlanes"
  },
  {
    "title": "Holes",
    "slug": "holes"
  },
  {
    "title": "Flip O",
    "slug": "flipo"
  },
  {
    "title": "Tower of Hanoi",
    "slug": "thanoi"
  },
  {
    "title": "Sum Ten",
    "slug": "sumten"
  },
  {
    "title": "TT Fence",
    "slug": "ttfence"
  },
  {
    "title": "C Tower",
    "slug": "ctower"
  },
  {
    "title": "Growth",
    "slug": "growth"
  },
  {
    "title": "GeoCent",
    "slug": "geocent"
  },
  {
    "title": "BS Fish",
    "slug": "bsfish"
  },
  {
    "title": "G Tail",
    "slug": "gtail"
  },
  {
    "title": "Breed C",
    "slug": "breedc"
  },
  {
    "title": "Kite",
    "slug": "kite"
  },
  {
    "title": "In Tow",
    "slug": "intow"
  },
  {
    "title": "Snaky",
    "slug": "snaky"
  },
  {
    "title": "Wiper",
    "slug": "wiper"
  },
  {
    "title": "R Wheel",
    "slug": "rwheel"
  },
  {
    "title": "Zoomio",
    "slug": "zoomio"
  },
  {
    "title": "Number Line",
    "slug": "numberline"
  },
  {
    "title": "Line B",
    "slug": "lineb"
  },
  {
    "title": "Make Maze",
    "slug": "makemaze"
  },
  {
    "title": "Square Bar",
    "slug": "squarebar"
  },
  {
    "title": "Teeter",
    "slug": "teeter"
  },
  {
    "title": "Reflector",
    "slug": "reflector"
  },
  {
    "title": "Lift Up",
    "slug": "liftup"
  },
  {
    "title": "Rock Paper Scissors",
    "slug": "rps"
  },
  {
    "title": "Number Ball",
    "slug": "numberball"
  },
  {
    "title": "Mirror Floor",
    "slug": "mirrorfloor"
  },
  {
    "title": "Cross Line",
    "slug": "crossline"
  },
  {
    "title": "Sub Jump",
    "slug": "subjump"
  },
  {
    "title": "Scaffold",
    "slug": "scaffold"
  },
  {
    "title": "Aerial Bar",
    "slug": "aerialbar"
  },
  {
    "title": "Pin Climb",
    "slug": "pinclimb"
  },
  {
    "title": "Parking",
    "slug": "parking"
  },
  {
    "title": "Balance",
    "slug": "balance"
  },
  {
    "title": "Bamboo",
    "slug": "bamboo"
  },
  {
    "title": "Froooog",
    "slug": "froooog"
  },
  {
    "title": "Find a Star",
    "slug": "findastar"
  },
  {
    "title": "Pairs Drop",
    "slug": "pairsdrop"
  },
  {
    "title": "Card Q",
    "slug": "cardq"
  },
  {
    "title": "Shiny",
    "slug": "shiny"
  },
  {
    "title": "Floater",
    "slug": "floater"
  },
  {
    "title": "Hopping P",
    "slug": "hoppingp"
  },
  {
    "title": "Up Down Press",
    "slug": "updownpress"
  }
]
GAMES

          node <<'NODE'
          const fs = require("node:fs");
          const additions = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/games-additions.json", "utf8"));
          const normalize = value => String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
          const catalog = JSON.parse(fs.readFileSync("games.json", "utf8"));
          const existing = new Set(catalog.games.map(game => normalize(game.title)));
          if (additions.length !== 50) throw new Error("Expected exactly 50 additions.");
          for (const item of additions) {
            if (!fs.existsSync("g/one-button-collection/" + item.slug + "/main.js")) {
              throw new Error("Missing game source: " + item.slug);
            }
            if (!fs.existsSync("g/one-button-collection/" + item.slug + "/screenshot.gif")) {
              throw new Error("Missing game thumbnail: " + item.slug);
            }
            const key = normalize(item.title);
            if (existing.has(key)) throw new Error("Duplicate catalog title: " + item.title);
            existing.add(key);
            catalog.games.push({
              title: item.title,
              path: "g/one-button-collection/?" + item.slug,
              image: "g/one-button-collection/" + item.slug + "/screenshot.gif",
              category: "ARCADE"
            });
          }
          fs.writeFileSync("games.json", JSON.stringify(catalog, null, 2) + "\n");
          console.log("Added " + additions.length + " games; catalog now has " + catalog.games.length + ".");
          NODE

          printf '%s\n' \
            "Source repository: https://github.com/abagames/crisp-game-lib-games" \
            "Upstream author: abagames" \
            "License: MIT (see LICENSE.txt and README-UPSTREAM.md)" \
            "Upstream commit: $source_commit" \
            "The game source and thumbnails are stored locally. The upstream index.html loads the crisp-game-lib engine and helper libraries from their published CDN URLs." \
            > g/one-button-collection/ATTRIBUTION.txt

      - name: Verify all 50 games and catalog entries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const catalog = JSON.parse(fs.readFileSync("games.json", "utf8"));
          const games = catalog.games.filter(game => String(game.path || "").startsWith("g/one-button-collection/?"));
          if (games.length !== 50) throw new Error("Expected 50 new games, found " + games.length);
          for (const game of games) {
            const slug = game.path.split("?")[1];
            if (!fs.existsSync("g/one-button-collection/" + slug + "/main.js")) throw new Error("Missing source for " + game.title);
            if (!fs.existsSync("g/one-button-collection/" + slug + "/screenshot.gif")) throw new Error("Missing thumbnail for " + game.title);
            if (!game.image || !game.title) throw new Error("Incomplete catalog entry for " + slug);
          }
          if (catalog.games.some(game => String(game.path || "").includes("duckmath-site"))) {
            throw new Error("DuckMath entries unexpectedly appeared in games.json");
          }
          console.log("Verified 50 game entries and local source/thumbnail files. Total catalog: " + catalog.games.length);
          NODE

      - name: Commit imported games
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json g/one-button-collection
          git commit -m "Add 50 kid-friendly browser games"
          git pull --rebase origin main
          git push
