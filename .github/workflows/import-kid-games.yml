name: Import 50 kid-friendly games

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-kid-games.yml"
      - "scripts/import-kid-games.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcade-atlas-kid-game-import
  cancel-in-progress: false

jobs:
  import-games:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Arcade Atlas
        uses: actions/checkout@v4

      - name: Download and install 50 games from GitHub
        shell: bash
        run: bash scripts/import-kid-games.sh
