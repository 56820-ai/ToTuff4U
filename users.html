<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Player directory | Arcade Atlas</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0f1c;--panel:#131e31;--text:#f3f6fc;--muted:#aab6ca;--mint:#65e6c2;--blue:#8db8ff}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#1d3450 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.65 system-ui,sans-serif}
    main{width:min(100%,620px);padding:clamp(24px,6vw,48px);border:1px solid #ffffff20;border-radius:22px;background:var(--panel);box-shadow:0 24px 70px #0006}p{color:var(--muted)}h1{margin:0 0 12px;font-size:clamp(28px,5vw,40px);line-height:1.15}a{color:var(--blue)}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.actions a{padding:11px 16px;border-radius:11px;background:#213149;text-decoration:none;font-weight:700}.actions a:first-child{background:var(--mint);color:#10231e}
  </style>
</head>
<body>
  <main>
    <p>ARCADE ATLAS · PLAYER INFO</p>
    <h1>There is no player directory</h1>
    <p>Arcade Atlas does not offer public player profiles or a member list. Public rankings show only the nickname and score a player chose to submit.</p>
    <div class="actions"><a href="./index.html#leaderboard">View leaderboards</a><a href="./my-scores.html">View My Scores</a><a href="./index.html">Back to the arcade</a></div>
  </main>
