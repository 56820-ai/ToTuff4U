<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8390067368864065" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../js/timeTracker.js" defer></script>
  <script src="../js/favicon.js"></script>
  <script src="../js/panic.js"></script>
  <script src="../js/autoclicker.js"></script>
  <title>Grades & Attendance</title>
  <link rel="icon" type="image/x-icon" href="../images/favicon.png">  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&family=Orbitron:wght@400;500&family=VT323&family=Pixelify+Sans&display=swap");

    :root {
      --bg-primary: #0a0a1a;
      --bg-secondary: #1a1a2e;
      --bg-tertiary: #25253a;
      --accent-pink: #ff6b9d;
      --accent-blue: #6b9dff;
      --accent-purple: #9d6bff;
      --accent-cyan: #6bffd9;
      --text-primary: #ffffff;
      --text-secondary: #c0c0d0;
      --shadow-md: 0 8px 15px rgba(0, 0, 0, 0.2);
      --shadow-lg: 0 15px 30px rgba(0, 0, 0, 0.3);
      --transition-normal: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Chakra Petch", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(157, 107, 255, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(255, 107, 157, 0.05) 0%, transparent 20%);
    }

    .leaderboard-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
    }

    .leaderboard-header {
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
      padding-bottom: 1.5rem;
    }

    .leaderboard-header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
      border-radius: 2px;
    }

    .beta-label {
      display: inline-block;
      vertical-align: middle;
      margin-left: 0.5rem;
      padding: 0.25rem 0.55rem;
      border: 1px solid var(--accent-cyan);
      border-radius: 999px;
      color: var(--accent-cyan);
      background: rgba(107, 255, 217, 0.10);
      font-family: "Chakra Petch", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 1px;
      text-shadow: none;
      -webkit-text-fill-color: var(--accent-cyan);
    }

    h1 {
      font-family: "Orbitron", sans-serif;
      font-size: 2.2rem;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 10px rgba(255, 107, 157, 0.3);
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
    }

    .game-logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
      border: 4px solid transparent;
      background: linear-gradient(var(--bg-secondary), var(--bg-secondary)) padding-box,
                  linear-gradient(135deg, var(--accent-pink), var(--accent-blue)) border-box;
      box-shadow: var(--shadow-md);
      transition: all var(--transition-bounce);
    }

    .game-logo:hover {
      transform: scale(1.05) rotate(5deg);
      box-shadow: 0 10px 25px rgba(255, 107, 157, 0.4);
    }

    .submit-btn, .submit-btn-link button {
      padding: 0.9rem 1.8rem;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: var(--text-primary);
      font-family: "Chakra Petch", sans-serif;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all var(--transition-bounce);
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
      z-index: 1;
      margin: 0.5rem;
    }

    .submit-btn::before, .submit-btn-link button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
      z-index: -1;
      opacity: 0;
      transition: opacity var(--transition-normal);
    }

    .submit-btn:hover, .submit-btn-link button:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .submit-btn:hover::before, .submit-btn-link button:hover::before {
      opacity: 1;
    }

    .leaderboard {
      width: 100%;
      background-color: rgba(26, 26, 46, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: var(--shadow-lg),
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
      padding: 1.5rem;
      border: 1px solid rgba(107, 157, 255, 0.2);
      max-height: 70vh;
      overflow-y: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .leaderboard::-webkit-scrollbar {
      display: none;
    }

    #score-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, 
                  rgba(37, 37, 58, 0.9), 
                  rgba(26, 26, 46, 0.9));
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow-md);
      transition: all var(--transition-bounce);
      border: 1px solid rgba(107, 157, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .leaderboard-item:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(255, 107, 157, 0.3);
    }

    .leaderboard-item::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 107, 157, 0.1) 0%, transparent 70%);
      transform: rotate(30deg);
      transition: all var(--transition-normal);
      opacity: 0;
    }

    .leaderboard-item:hover::before {
      opacity: 1;
      transform: rotate(0deg);
    }

    .user-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      margin-right: 1.5rem;
      border: 3px solid transparent;
      background: linear-gradient(var(--bg-secondary), var(--bg-secondary)) padding-box,
                  linear-gradient(135deg, var(--accent-pink), var(--accent-blue)) border-box;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      transition: all var(--transition-bounce);
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .leaderboard-item:hover .user-icon {
      transform: scale(1.1);
      box-shadow: 0 8px 25px rgba(255, 107, 157, 0.4);
    }

    .user-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-info {
      flex-grow: 1;
      position: relative;
      z-index: 2;
    }

    .game-title {
      font-family: "Pixelify Sans", sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .game-title i {
      color: var(--accent-pink);
      transition: transform var(--transition-normal);
    }

    .leaderboard-item:hover .game-title i {
      transform: scale(1.2);
    }

    .username {
      font-family: "VT323", monospace;
      font-size: 1.5rem;
      color: var(--text-primary);
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .username i {
      color: var(--accent-blue);
      transition: transform var(--transition-normal);
    }

    .leaderboard-item:hover .username i {
      transform: scale(1.2);
    }

    .date {
      font-family: "VT323", monospace;
      font-size: 1.3rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .date i {
      color: var(--accent-purple);
      transition: transform var(--transition-normal);
    }

    .leaderboard-item:hover .date i {
      transform: scale(1.2);
    }

    .score {
      font-family: "Orbitron", sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      border: 2px solid rgba(107, 157, 255, 0.3);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      transition: all var(--transition-normal);
      flex-shrink: 0;
      margin-left: 1rem;
      position: relative;
      z-index: 2;
    }

    .leaderboard-item:hover .score {
      border-color: rgba(255, 107, 157, 0.5);
      box-shadow: 0 5px 15px rgba(255, 107, 157, 0.2);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .leaderboard-container {
        padding: 1.5rem;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      .leaderboard-item {
        flex-direction: column;
        text-align: center;
        padding: 1.5rem 1rem;
      }
      
      .user-icon {
        margin-right: 0;
        margin-bottom: 1rem;
        width: 70px;
        height: 70px;
      }
      
      .player-info {
        margin-right: 0;
        margin-bottom: 1rem;
      }
      
      .game-title, .username, .date {
        justify-content: center;
      }
      
      .score {
        margin-left: 0;
        margin-top: 0.5rem;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.5rem;
      }
      
      .submit-btn, .submit-btn-link button {
        padding: 0.7rem 1.4rem;
        font-size: 0.9rem;
      }
      
      .game-title {
        font-size: 1.3rem;
      }
      
      .username, .date {
        font-size: 1.2rem;
      }
      
      .score {
        font-size: 1.3rem;
      }
    }
  
    /* Responsive layout: keep the document scrollable instead of trapping content. */
    html { height: auto; min-height: 100%; overflow-y: auto; }
    body { height: auto; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }
    .leaderboard-container { width: min(100%, 1000px); min-width: 0; padding: clamp(0.75rem, 4vw, 2.5rem); }
    .leaderboard { height: auto !important; max-height: none !important; overflow: visible !important; }
    #score-list { min-width: 0; }
    .leaderboard-item { min-width: 0; }
    .player-info { min-width: 0; overflow-wrap: anywhere; }
    .game-title, .username, .date, .score { overflow-wrap: anywhere; }
    @media (max-width: 700px) {
      .leaderboard-container { padding: 1rem 0.75rem; }
      h1 { font-size: clamp(1.25rem, 6vw, 1.8rem); letter-spacing: 1px; }
      .leaderboard-item { gap: 0.5rem; }
      .game-title { font-size: 1.1rem; }
      .username, .date { font-size: 1rem; }
      .score { font-size: 1.15rem; }
    }

 
    /* Top-three podium */
    #score-list { list-style:none; display:flex; flex-direction:column; gap:2rem; }
    .podium-section { padding:1.25rem; border:1px solid rgba(107,255,217,.18); border-radius:20px; background:rgba(18,25,42,.72); }
    .podium-game-title { text-align:center; font:700 1.35rem "Orbitron",sans-serif; margin:0 0 1.4rem; color:#e9faff; }
    .podium { display:flex; align-items:flex-end; justify-content:center; gap:clamp(.5rem,2vw,1.25rem); max-width:680px; margin:0 auto; min-height:245px; }
    .podium-place { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; text-align:center; gap:.45rem; }
    .podium-avatar { width:clamp(48px,9vw,76px); height:clamp(48px,9vw,76px); border-radius:50%; object-fit:cover; border:3px solid #6b9dff; background:#1a1a2e; }
    .podium-crown { font-size:1.4rem; line-height:1.2; min-height:1.4rem; }
    .podium-name { width:100%; overflow-wrap:anywhere; font:700 clamp(1rem,2.4vw,1.25rem) "Chakra Petch",sans-serif; color:#fff; }
    .podium-score { font:700 clamp(.85rem,2vw,1.1rem) "Orbitron",sans-serif; color:#6bffd9; overflow-wrap:anywhere; }
    .podium-block { width:100%; display:flex; justify-content:center; align-items:center; border-radius:12px 12px 0 0; font:700 1.5rem "Orbitron",sans-serif; color:#101522; min-height:74px; background:linear-gradient(180deg,#8d9bb0,#586579); }
    .podium-place.first .podium-block { min-height:126px; background:linear-gradient(180deg,#ffe58a,#d49a25); }
    .podium-place.second .podium-block { min-height:96px; background:linear-gradient(180deg,#e5edf8,#8e9eaf); }
    .podium-place.third .podium-block { min-height:74px; background:linear-gradient(180deg,#e9a477,#a95c38); }
    .podium-place.first .podium-avatar { border-color:#ffd45e; }
    .podium-place.second .podium-avatar { border-color:#c5d2e2; }
    .podium-place.third .podium-avatar { border-color:#cd875e; }
    .podium-empty { opacity:.5; font-size:.85rem; }
    @media(max-width:480px) { .podium-section{padding:.8rem .45rem}.podium{gap:.35rem;min-height:205px}.podium-place.first .podium-block{min-height:105px}.podium-place.second .podium-block{min-height:80px}.podium-place.third .podium-block{min-height:62px}.podium-name{font-size:.95rem}.podium-score{font-size:.8rem} }
\n    </style>

<body>
  <div class="leaderboard-container">
    <header class="leaderboard-header">
      <h1>Game High Scores <span class="beta-label">BETA</span></h1>
      <p class="submit-note">Scores are collected automatically in supported games. Enter your name when prompted; it is remembered for future games. Minecraft ranks by total playtime.</p>
      <a href="../">
      </a>
    </header>
    <div class="leaderboard">
      <div id="score-list"></div>
    </div>
  </div>

  <script src="../js/arcade-score-config.js?v=4f631d8"></script>
  <script src="../js/arcade-scores.js?v=4f631d8"></script>
  <script>
    const scoreList = document.getElementById("score-list");

    function getGameLogo(gameTitle) {
      const game = String(gameTitle || "").trim().toLowerCase();
      const logos = {
        "slope": "../images/slope.png",
        "retro bowl": "../images/retrobowl.jpg",
        "retro bowl time": "../images/retrobowl.jpg",
        "gunspin": "../images/gunspin.png",
        "block blast": "../images/blockblast.png",
        "drift boss": "../images/driftboss.png",
        "snow rider 3d": "../images/snowrider3d.png",
        "stacktris": "../images/stacktris.jpg",
        "minecraft": "../images/mc.png",
        "2048": "../images/2048.png",
        "cookie clicker": "../g/cookieclicker/img/icon.png",
        "geometry dash": "../images/geodash.jpg",
        "subway surfers": "data:image/svg+xml;charset=UTF-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#27d9e8"/><stop offset="1" stop-color="#2875ff"/></linearGradient></defs><rect width="128" height="128" rx="28" fill="#17233b"/><path d="M64 13 80 35 74 58 94 83 81 112 49 112 34 84 50 58 44 35Z" fill="url(#g)"/><circle cx="64" cy="28" r="11" fill="#ffd36a"/><path d="m50 52 14 11 14-11M49 84l-16 15m45-15 17 15" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>'),
        "breakout": "data:image/svg+xml;charset=UTF-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#ffb347"/><stop offset="1" stop-color="#ff416c"/></linearGradient></defs><rect width="128" height="128" rx="28" fill="#17172b"/><g fill="url(#g)"><rect x="17" y="20" width="27" height="13" rx="4"/><rect x="50" y="20" width="27" height="13" rx="4"/><rect x="83" y="20" width="27" height="13" rx="4"/><rect x="17" y="39" width="27" height="13" rx="4"/><rect x="50" y="39" width="27" height="13" rx="4"/><rect x="83" y="39" width="27" height="13" rx="4"/></g><circle cx="66" cy="75" r="8" fill="#fff"/><rect x="39" y="99" width="50" height="9" rx="4.5" fill="#6b9dff"/></svg>'),
        "reaction test": "data:image/svg+xml;charset=UTF-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#65f0bd"/><stop offset="1" stop-color="#3987ff"/></linearGradient></defs><rect width="128" height="128" rx="28" fill="#17172b"/><circle cx="64" cy="64" r="42" fill="none" stroke="url(#g)" stroke-width="10"/><path d="M64 34v31l22 13" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 8v10M120 64h-10M64 120v-10M8 64h10" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>')
      };
      return logos[game] || "../images/favicon.png";
    }

    function createPodiumSection(gameTitle, players, timedGames) {
      const section = document.createElement("section");
      section.className = "podium-section";
      const heading = document.createElement("h2");
      heading.className = "podium-game-title";
      heading.textContent = gameTitle;
      const podium = document.createElement("div");
      podium.className = "podium";
      const order = [
        { rank: 2, cls: "second", medal: "🥈" },
        { rank: 1, cls: "first", medal: "👑" },
        { rank: 3, cls: "third", medal: "🥉" }
      ];
      order.forEach(place => {
        const item = players[place.rank - 1];
        const card = document.createElement("div");
        card.className = "podium-place " + place.cls;
        if (item) {
          const crown = document.createElement("div");
          crown.className = "podium-crown";
          crown.textContent = place.medal;
          const avatar = document.createElement("img");
          avatar.className = "podium-avatar";
          avatar.src = getGameLogo(item.game_title);
          avatar.alt = "";
          const name = document.createElement("div");
          name.className = "podium-name";
          name.textContent = item.player_name || "Player";
          const seconds = Math.max(0, Number(item.score) || 0);
          const gameKey = String(item.game_title || "").trim().toLowerCase();
          const timed = timedGames.has(gameKey);
          const reaction = gameKey === "reaction test";
          const displayScore = timed
            ? Math.floor(seconds / 86400) + "d " + Math.floor((seconds % 86400) / 3600) + "h " + Math.floor((seconds % 3600) / 60) + "m"
            : reaction ? Math.max(0, 10000 - seconds).toLocaleString() + " ms" : seconds.toLocaleString();
          const score = document.createElement("div");
          score.className = "podium-score";
          score.textContent = displayScore;
          const block = document.createElement("div");
          block.className = "podium-block";
          block.textContent = String(place.rank);
          card.append(crown, avatar, name, score, block);
        } else {
          const empty = document.createElement("div");
          empty.className = "podium-empty";
          empty.textContent = "—";
          const block = document.createElement("div");
          block.className = "podium-block";
          block.textContent = String(place.rank);
          card.append(empty, block);
        }
        podium.appendChild(card);
      });
      section.append(heading, podium);
      scoreList.appendChild(section);
    }

    async function renderLeaderboard() {
      const loadedScores = window.ArcadeScores ? await window.ArcadeScores.getScores() : [];
      // Hide legacy/invalid Slope entries above the 1,500-point limit.
      const onlineScores = loadedScores.filter(item =>
        String(item.game_title || "").trim().toLowerCase() !== "slope" || Number(item.score) <= 1500
      );
      if (!onlineScores.length) {
        const empty = document.createElement("p");
        empty.className = "leaderboard-empty";
        empty.style.cssText = "text-align:center;padding:2rem;color:#c0c0d0;overflow-wrap:anywhere;";
        if (!window.ArcadeScores || !window.ArcadeScores.configured || window.ArcadeScores.lastLoadError) {
          empty.textContent = "The leaderboard couldn't connect to the score database. " +
            (window.ArcadeScores && window.ArcadeScores.lastLoadError ? "Error: " + window.ArcadeScores.lastLoadError : "Check the score database configuration and try again.");
        } else {
          empty.textContent = "No real scores have been recorded yet. Play a supported game to add the first score!";
        }
        scoreList.appendChild(empty);
        return;
      }

      // Keep each player's best score per game; accumulate total playtime games.
      const timedGames = new Set(["minecraft", "retro bowl time"]);
      const bestByGameAndPlayer = new Map();
      onlineScores.forEach(item => {
        const gameKey = String(item.game_title || "Game").trim().toLowerCase();
        const playerKey = String(item.player_name || "Player").trim().toLowerCase();
        const key = gameKey + "::" + playerKey;
        if (timedGames.has(gameKey)) {
          const previous = bestByGameAndPlayer.get(key);
          if (previous) {
            previous.score += Number(item.score) || 0;
            if (new Date(item.created_at) > new Date(previous.created_at)) previous.created_at = item.created_at;
          } else bestByGameAndPlayer.set(key, { ...item, score: Number(item.score) || 0 });
        } else {
          const previous = bestByGameAndPlayer.get(key);
          if (!previous || Number(item.score) > Number(previous.score)) bestByGameAndPlayer.set(key, item);
        }
      });

      const byGame = new Map();
      [...bestByGameAndPlayer.values()].forEach(item => {
        const key = String(item.game_title || "Game").trim().toLowerCase();
        if (!byGame.has(key)) byGame.set(key, []);
        byGame.get(key).push(item);
      });

      [...byGame.entries()].sort((a,b) => a[0].localeCompare(b[0])).forEach(([key, players]) => {
        // Reaction Test stores an inverted score (10000 - milliseconds),
        // so a higher stored value means a faster reaction and ranks first.
        players.sort((a,b) => Number(b.score) - Number(a.score));
        const title = key === "retro bowl time" ? "Retro Bowl · Total Playtime" : players[0].game_title;
        createPodiumSection(title, players.slice(0,3), timedGames);
      });
    }
    renderLeaderboard();
  </script>

</body>
</html>
