<!DOCTYPE html>

<head>

  <title>Arcade Atlas — Leaderboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&family=Pixelify+Sans:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a18;
      --panel: rgba(23, 25, 48, .88);
      --panel-soft: rgba(31, 34, 61, .78);
      --pink: #ff6b9d;
      --blue: #6b9dff;
      --purple: #a477ff;
      --cyan: #6bffd9;
      --text: #f7f7ff;
      --muted: #b9bfd5;
      --line: rgba(126, 151, 255, .2);
      --shadow: 0 16px 40px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; overflow-x: hidden; }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden;
      color: var(--text); font-family: "Chakra Petch", sans-serif; line-height: 1.55;
      background:
        radial-gradient(ellipse at 12% 4%, rgba(164,119,255,.16), transparent 32rem),
        radial-gradient(ellipse at 92% 28%, rgba(255,107,157,.10), transparent 30rem),
        linear-gradient(180deg, #090a18 0%, #0c1022 52%, #090a18 100%);
    }
    .leaderboard-container { width: min(100% - 32px, 980px); margin: 0 auto; padding: clamp(22px, 4vw, 48px) 0 56px; }
    .leaderboard-header { position: relative; text-align: center; margin: 0 0 28px; padding: 8px 12px 24px; }
    .leaderboard-header::after {
      content: ""; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      width: min(240px, 55vw); height: 3px; border-radius: 9px;
      background: linear-gradient(90deg, transparent, var(--pink), var(--purple), var(--blue), transparent);
      box-shadow: 0 0 22px rgba(164,119,255,.45);
    }
    .arcade-brand { display: inline-flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
    .arcade-brand img { display: block; width: min(270px, 68vw); max-height: 112px; object-fit: contain; filter: drop-shadow(0 7px 24px rgba(107,157,255,.24)); }
    h1 {
      margin: 0; font: 800 clamp(1.45rem, 5vw, 2.35rem)/1.2 "Orbitron", sans-serif;
      letter-spacing: clamp(1px, .35vw, 3px);
      background: linear-gradient(100deg, #ff8bb4 8%, #b58aff 50%, #78c7ff 92%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 5px 28px rgba(164,119,255,.16);
    }
    .beta-label {
      display: inline-block; vertical-align: middle; margin-left: 7px; padding: 4px 8px;
      border: 1px solid rgba(107,255,217,.55); border-radius: 999px; color: var(--cyan);
      background: rgba(107,255,217,.08); font: 700 .62rem "Chakra Petch", sans-serif; letter-spacing: 1px;
      -webkit-text-fill-color: var(--cyan);
    }
    .submit-note { max-width: 690px; margin: 12px auto 0; color: var(--muted); font-size: .98rem; }
    .leaderboard {
      position: relative; padding: clamp(12px, 2.5vw, 22px); border: 1px solid var(--line);
      border-radius: 24px; background: linear-gradient(145deg, rgba(24,27,51,.86), rgba(13,17,36,.92));
      box-shadow: var(--shadow), inset 0 1px rgba(255,255,255,.05); backdrop-filter: blur(14px);
    }
    #score-list { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
    .game-board {
      min-width: 0; padding: clamp(12px, 2.4vw, 20px); border: 1px solid rgba(107,157,255,.2);
      border-radius: 18px; background: linear-gradient(135deg, rgba(35,37,66,.72), rgba(20,24,47,.78));
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }
    .game-board-title {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin: 0 0 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(151,139,255,.18);
      color: #f5f3ff; text-align: center; font: 700 clamp(1rem, 2.7vw, 1.35rem)/1.3 "Orbitron", sans-serif;
      overflow-wrap: anywhere;
    }
    .game-board-title::before, .game-board-title::after {
      content: ""; width: clamp(18px, 5vw, 48px); height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,107,157,.7));
    }
    .game-board-title::after { transform: scaleX(-1); }
    .podium-stage {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end;
      gap: clamp(9px, 2vw, 20px); padding: 44px clamp(4px, 2vw, 18px) 8px;
      max-width: 850px; margin: 0 auto; min-height: 390px;
    }
    .podium-card {
      position: relative; display: flex; flex-direction: column; justify-content: flex-end;
      min-width: 0; text-align: center; border-radius: 18px 18px 12px 12px;
      padding: 0 clamp(7px, 1.5vw, 14px) 16px; isolation: isolate;
      box-shadow: 0 18px 34px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.42);
      border: 1px solid rgba(255,255,255,.22); transition: transform .2s ease, filter .2s ease;
    }
    .podium-card:hover { transform: translateY(-5px); filter: brightness(1.08); }
    .podium-rank-1 { grid-column: 2; grid-row: 1; min-height: 285px; z-index: 2;
      background: linear-gradient(155deg,#fff2a6 0%,#f5c94d 24%,#d99a19 62%,#88500b 100%);
      box-shadow: 0 0 34px rgba(255,207,75,.19), 0 18px 34px rgba(0,0,0,.34), inset 0 2px rgba(255,255,255,.7); }
    .podium-rank-2 { grid-column: 1; grid-row: 1; min-height: 235px;
      background: linear-gradient(155deg,#f4f7ff 0%,#b9c5d5 28%,#78879b 68%,#3d4a5d 100%);
      box-shadow: 0 0 28px rgba(184,205,232,.14), 0 18px 34px rgba(0,0,0,.34), inset 0 2px rgba(255,255,255,.72); }
    .podium-rank-3 { grid-column: 3; grid-row: 1; min-height: 195px;
      background: linear-gradient(155deg,#ffd0a8 0%,#d88b56 30%,#a85d32 68%,#61301e 100%);
      box-shadow: 0 0 28px rgba(220,137,87,.14), 0 18px 34px rgba(0,0,0,.34), inset 0 2px rgba(255,255,255,.55); }
    .podium-medal { position: absolute; top: -39px; left: 50%; transform: translateX(-50%);
      font-size: clamp(2rem, 5vw, 3rem); line-height: 1; filter: drop-shadow(0 5px 7px rgba(0,0,0,.35)); }
    .podium-place { margin: 0 0 8px; color: rgba(25,20,30,.82); font: 800 clamp(.68rem,1.5vw,.9rem) "Orbitron",sans-serif; letter-spacing: 1.5px; text-transform: uppercase; }
    .podium-player { margin: 0 auto 8px; max-width: 100%; color: #17131d;
      font: 700 clamp(.9rem,2vw,1.22rem)/1.2 "Pixelify Sans",sans-serif; overflow-wrap: anywhere; text-shadow: 0 1px rgba(255,255,255,.28); }
    .podium-game-image { width: clamp(38px,6vw,58px); height: clamp(38px,6vw,58px); margin: 0 auto 8px;
      object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,.55);
      box-shadow: 0 5px 14px rgba(0,0,0,.25); }
    .podium-score { display: block; width: 100%; margin-top: auto; padding: 10px 5px;
      color: #fff; border-radius: 10px; background: rgba(27,20,17,.22);
      border: 1px solid rgba(255,255,255,.25); font: 800 clamp(.75rem,1.8vw,1.05rem)/1.3 "Orbitron",sans-serif;
      overflow-wrap: anywhere; text-shadow: 0 2px 5px rgba(0,0,0,.38); }
    .podium-date { margin: 7px 0 0; color: rgba(30,24,28,.78); font: 400 .85rem "VT323",monospace; }
    .game-board-title { gap: 12px; }
    .game-title-image { width: 42px; height: 42px; object-fit: cover; border-radius: 10px;
      border: 1px solid rgba(160,175,255,.45); box-shadow: 0 4px 14px rgba(0,0,0,.3); }
    @media (max-width: 520px) {
      .podium-stage { gap: 7px; min-height: 290px; padding: 38px 0 4px; }
      .podium-card { border-radius: 13px 13px 9px 9px; padding: 0 5px 10px; }
      .podium-rank-1 { min-height: 220px; }
      .podium-rank-2 { min-height: 185px; }
      .podium-rank-3 { min-height: 155px; }
      .podium-medal { top: -31px; }
      .podium-place { font-size: .58rem; letter-spacing: .5px; }
      .podium-player { font-size: .78rem; }
      .podium-score { font-size: .66rem; padding: 7px 3px; }
      .podium-date { font-size: .72rem; }
    }
    @media (max-width: 350px) {
      .podium-stage { gap: 4px; }
      .podium-player { font-size: .68rem; }
    }
    .leaderboard-status { padding: 28px 12px; color: var(--muted); text-align: center; font-size: 1rem; }
    @media (max-width: 520px) {
      .leaderboard-container { width: min(100% - 18px, 980px); padding-top: 18px; }
      .leaderboard { padding: 9px; border-radius: 18px; }
      .game-board { padding: 10px 8px; border-radius: 14px; }
      .score-card { gap: 8px; padding: 9px 7px; border-radius: 12px; }
      .rank-medal { flex-basis: 25px; font-size: 1.25rem; }
      .game-icon-container { flex-basis: 40px; width: 40px; height: 40px; border-radius: 10px; }
      .leaderboard-score { max-width: 32%; padding: 6px 7px; font-size: .7rem; }
      .game-name, .score-date { font-size: .86rem; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }

    /* Cleaner, compact leaderboard layout */
    .leaderboard-container { width: min(100% - 32px, 1040px); padding-top: 24px; }
    .leaderboard-header { margin-bottom: 20px; padding-bottom: 18px; }
    .arcade-brand img { width: min(220px, 58vw); max-height: 82px; }
    .submit-note { margin-top: 8px; font-size: .92rem; }
    .leaderboard { padding: clamp(12px, 2vw, 20px); border-radius: 20px; }
    #score-list { gap: 14px; }
    .leaderboard-tools { position: sticky; top: 8px; z-index: 5; display: grid; grid-template-columns: minmax(180px, 1fr) minmax(180px, .8fr) auto; gap: 12px; align-items: end; padding: 14px; border: 1px solid rgba(126,151,255,.25); border-radius: 15px; background: rgba(12,16,35,.96); box-shadow: 0 8px 24px rgba(0,0,0,.25); backdrop-filter: blur(12px); }
    .search-wrap, .sort-wrap { display: grid; gap: 5px; color: var(--muted); font-size: .78rem; font-weight: 700; letter-spacing: .04em; }
    .leaderboard-tools input, .leaderboard-tools select { width: 100%; min-width: 0; height: 42px; padding: 0 12px; color: var(--text); border: 1px solid rgba(126,151,255,.28); border-radius: 10px; outline: none; background: #11162d; font: 500 .95rem "Chakra Petch",sans-serif; }
    .leaderboard-tools input:focus, .leaderboard-tools select:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(107,255,217,.12); }
    .game-count { padding: 0 3px 10px; color: var(--muted); white-space: nowrap; font-size: .82rem; }
    .game-board { padding: 14px 16px; border-radius: 15px; scroll-margin-top: 90px; }
    .game-board[hidden] { display: none; }
    .game-board-title { justify-content: flex-start; gap: 10px; margin-bottom: 10px; padding-bottom: 10px; font-size: 1.05rem; }
    .game-board-title::before, .game-board-title::after { display: none; }
    .game-title-image { width: 34px; height: 34px; flex: 0 0 34px; }
    .game-board-total { margin-left: auto; color: var(--muted); font: 500 .78rem "Chakra Petch",sans-serif; white-space: nowrap; }
    .score-rows { display: grid; gap: 7px; }
    .score-row { display: grid; grid-template-columns: 58px 42px minmax(0,1fr) minmax(100px,auto); gap: 12px; align-items: center; min-height: 62px; padding: 8px 12px; border: 1px solid rgba(126,151,255,.15); border-radius: 12px; background: rgba(10,14,31,.58); }
    .score-rank { color: #e8e9f7; font: 700 .88rem "Orbitron",sans-serif; white-space: nowrap; }
    .score-game-image { width: 38px; height: 38px; object-fit: cover; border-radius: 9px; border: 1px solid rgba(160,175,255,.35); }
    .score-player-info { display: grid; min-width: 0; gap: 2px; }
    .score-player { overflow-wrap: anywhere; color: var(--text); font-size: .98rem; }
    .score-date { color: var(--muted); font-size: .76rem; }
    .score-value { justify-self: end; max-width: 100%; padding: 8px 11px; border: 1px solid rgba(107,255,217,.2); border-radius: 9px; color: var(--cyan); background: rgba(107,255,217,.07); font: 700 .88rem "Orbitron",sans-serif; text-align: right; overflow-wrap: anywhere; }
    .score-row.rank-1 { border-color: rgba(255,207,75,.3); }
    .score-row.rank-2 { border-color: rgba(184,205,232,.25); }
    .score-row.rank-3 { border-color: rgba(220,137,87,.25); }
    .leaderboard-status { padding: 30px 12px; }
    @media (max-width: 620px) {
      .leaderboard-container { width: min(100% - 18px, 1040px); padding-top: 14px; }
      .leaderboard-tools { position: static; grid-template-columns: 1fr; gap: 9px; padding: 11px; }
      .game-count { padding: 0; }
      .game-board { padding: 11px 9px; }
      .score-row { grid-template-columns: 46px 34px minmax(0,1fr); gap: 8px; padding: 8px; }
      .score-game-image { width: 32px; height: 32px; }
      .score-value { grid-column: 3; justify-self: start; margin-top: -2px; padding: 5px 8px; font-size: .75rem; text-align: left; }
      .score-rank { font-size: .72rem; }
      .game-board-title { font-size: .9rem; }
      .game-title-image { width: 30px; height: 30px; flex-basis: 30px; }
      .game-board-total { font-size: .7rem; }
    }
  </style>
</head>
<body>
  <div class="leaderboard-container">
    <header class="leaderboard-header">
      <a class="arcade-brand" href="../" aria-label="Arcade Atlas home"><img src="../assets/arcade-atlas-logo.png" alt="Arcade Atlas logo"></a>
      <h1>Game High Scores <span class="beta-label">BETA</span></h1>
      <p class="submit-note">Browse game records, search for a title, and jump straight to its top players.</p>
    </header>
    <div class="leaderboard">
      <div id="score-list" aria-live="polite"></div>
    </div>
  </div>
