<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Neon Dodge</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080b18;color:#eef2ff;font:16px system-ui,sans-serif;display:grid;min-height:100vh;place-items:center;padding:16px}.wrap{width:min(920px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}h1{margin:0;font-size:clamp(1.5rem,4vw,2.5rem);letter-spacing:.08em;color:#70f0ff;text-shadow:0 0 18px #00bcd455}.stats{display:flex;gap:10px}.stat{background:#111a30;border:1px solid #283653;border-radius:12px;padding:8px 14px;min-width:90px;text-align:center}.stat small{display:block;color:#91a4c7;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em}.stat b{font-size:1.25rem}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#090e20;border:1px solid #25324f;border-radius:16px;box-shadow:0 18px 60px #0008;touch-action:none}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap;color:#9fb0d0}.btn{border:0;border-radius:10px;background:#70f0ff;color:#06101b;font-weight:800;padding:11px 18px;cursor:pointer}.btn:focus-visible{outline:3px solid white;outline-offset:3px}.touch{display:none;justify-content:center;gap:8px;margin-top:12px}.touch button{width:58px;height:48px;border-radius:12px;border:1px solid #324365;background:#17223a;color:white;font-size:1.2rem}@media(max-width:700px){.touch{display:flex}.bar{font-size:.85rem}}
</style>
</head>
<body><main class="wrap">
<header><h1>NEON DODGE</h1><div class="stats"><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div></header>
<canvas id="game" width="960" height="540" aria-label="Neon Dodge game area"></canvas>
<div class="bar"><span>Move with ← → or A / D. Dodge the falling neon blocks.</span><button class="btn" id="start">START / RESTART</button></div>
<div class="touch" aria-label="Touch controls"><button data-dir="-1" aria-label="Move left">◀</button><button data-dir="1" aria-label="Move right">▶</button></div>
</main>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),start=document.getElementById('start');let best=0;try{best=+(localStorage.getItem('neonDodgeBest')||0)}catch{}bestEl.textContent=best;
let player={x:480,y:470,w:34,h:34},blocks=[],score=0,alive=false,last=0,spawn=0,keys={};const W=960,H=540;
function reset(){player.x=W/2-player.w/2;blocks=[];score=0;spawn=0;alive=true;last=performance.now();scoreEl.textContent='0';start.textContent='RESTART';requestAnimationFrame(loop)}
function end(){alive=false;start.textContent='PLAY AGAIN';ctx.fillStyle='#07101ddd';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#ff658a';ctx.font='bold 52px system-ui';ctx.fillText('GAME OVER',W/2,H/2-20);ctx.fillStyle='#e8f2ff';ctx.font='24px system-ui';ctx.fillText('Score: '+Math.floor(score),W/2,H/2+28);ctx.font='18px system-ui';ctx.fillText('Press START / RESTART to play again',W/2,H/2+70)}
function loop(t){if(!alive)return;const dt=Math.min((t-last)/1000,.04);last=t;score+=dt*10;scoreEl.textContent=Math.floor(score);if(keys.ArrowLeft||keys.a||keys.A)player.x-=390*dt;if(keys.ArrowRight||keys.d||keys.D)player.x+=390*dt;player.x=Math.max(0,Math.min(W-player.w,player.x));spawn+=dt;let interval=Math.max(.28,.85-score/1200);if(spawn>interval){spawn=0;let w=34+Math.random()*72;blocks.push({x:Math.random()*(W-w),y:-45,w,h:20+Math.random()*30,speed:190+Math.min(score*1.8,330)})}
ctx.clearRect(0,0,W,H);ctx.strokeStyle='#172541';ctx.lineWidth=1;for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.shadowBlur=20;ctx.shadowColor='#70f0ff';ctx.fillStyle='#70f0ff';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.shadowBlur=0;
for(const b of blocks){b.y+=b.speed*dt;ctx.shadowBlur=14;ctx.shadowColor='#ff4f86';ctx.fillStyle='#ff4f86';ctx.fillRect(b.x,b.y,b.w,b.h);if(player.x<b.x+b.w&&player.x+player.w>b.x&&player.y<b.y+b.h&&player.y+player.h>b.y){if(Math.floor(score)>best){best=Math.floor(score);bestEl.textContent=best;try{localStorage.setItem('neonDodgeBest',best)}catch{}}end();return}}
blocks=blocks.filter(b=>b.y<H+50);ctx.shadowBlur=0;requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' '&&!alive)reset()});window.addEventListener('keyup',e=>keys[e.key]=false);start.addEventListener('click',reset);
document.querySelectorAll('[data-dir]').forEach(btn=>{const dir=btn.dataset.dir;btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[dir==='-1'?'ArrowLeft':'ArrowRight']=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>keys[dir==='-1'?'ArrowLeft':'ArrowRight']=false))});
ctx.fillStyle='#70f0ff';ctx.textAlign='center';ctx.font='bold 36px system-ui';ctx.fillText('NEON DODGE',W/2,H/2-10);ctx.fillStyle='#a9b8d4';ctx.font='20px system-ui';ctx.fillText('Press START to begin',W/2,H/2+30);
})();
</script></body></html>
