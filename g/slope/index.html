<html>
<head>
<script src="../../js/favicon.js"></script>
<script src="../../js/panic.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-X514E26P5B"></script>
<script src="../../js/gtag.js"></script>
  <script src="../../js/arcade-score-config.js?v=2"></script>
<script src="../../js/arcade-scores.js?v=2"></script>
  <script src="../../js/timeTracker.js" defer></script>
<script src="../../js/auto-clicker.js"></script>
<title>Grades & Attendence</title>
<link rel="icon" type="image/x-icon" href="../../images/favicon.png">
<link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="TemplateData/unityloader41.js"></script>
    <script>
        // Preserve Unity's canvas so the leaderboard detector can inspect the end screen.
        (function () {
            var originalGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function (type, attributes) {
                if (/webgl/i.test(String(type)) && this.closest && this.closest("#gameContainer")) {
                    attributes = Object.assign({}, attributes || {}, { preserveDrawingBuffer: true });
                }
                return originalGetContext.call(this, type, attributes);
            };
        })();

        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/slope.json", {
            onProgress: UnityProgress,
            Module: { onRuntimeInitialized: function () { UnityProgress(gameInstance, "complete"); } }
        });

        (function () {
          function connectSlopeLeaderboard() {
            var leaderboardReady = !!(window.ArcadeScores && window.ArcadeScores.configured);
            var workerPromise = null, scanning = false, handled = false, endScreenHits = 0, latestScore = null, lastPromptAt = 0;
            var status = document.createElement("div");
            status.id = "slope-ocr-status";
            status.style.cssText = "position:fixed;left:10px;bottom:10px;z-index:2147483647;padding:8px 11px;border-radius:8px;background:#101525;color:#fff;border:1px solid #6bffd9;font:12px sans-serif;max-width:min(90vw,420px);";
            status.textContent = "Slope leaderboard: starting OCR…";
            document.body.appendChild(status);
            function setStatus(message) { status.textContent = "Slope leaderboard: " + message; }
            function promptOcrIssue(message) {
              setStatus(message);
              var now = Date.now();
              if (now - lastPromptAt > 60000) { lastPromptAt = now; window.alert("Slope leaderboard OCR needs attention. " + message + "\\n\\nReload Slope and try again. Scores are not submitted unless OCR detects them."); }
            }
            function worker() {
                if (!workerPromise) workerPromise = window.Tesseract.createWorker("eng");
                return workerPromise;
            }
            function normalized(s) {
                return String(s || "").toLowerCase().replace(/[^a-z0-9\s:]/g, " ").replace(/\s+/g, " ").trim();
            }
            function isGameOver(s) {
                return /game\s*over|try\s*again|play\s*again|you\s*crashed|crashed|best\s*score|again/.test(normalized(s));
            }
            function extractScore(s) {
                var clean = String(s || "").replace(/,/g, "");
                var m = clean.match(/(?:score|distance|points?)\s*[:\-]?\s*([0-9]{1,9})/i);
                if (m) return Math.max(0, Number(m[1]) || 0);
                var nums = clean.match(/\b[0-9]{1,9}\b/g) || [];
                return nums.length ? Math.max(0, Number(nums[nums.length - 1]) || 0) : 0;
            }
            async function readCanvas(canvas) {
                var image = document.createElement("canvas");
                var scale = Math.min(2, 2200 / Math.max(canvas.width, canvas.height));
                image.width = Math.max(1, Math.round(canvas.width * scale));
                image.height = Math.max(1, Math.round(canvas.height * scale));
                var ctx = image.getContext("2d", { willReadFrequently: true });
                ctx.drawImage(canvas, 0, 0, image.width, image.height);
                var pixels = ctx.getImageData(0, 0, image.width, image.height);
                for (var i = 0; i < pixels.data.length; i += 4) {
                    var gray = pixels.data[i] * 0.299 + pixels.data[i + 1] * 0.587 + pixels.data[i + 2] * 0.114;
                    var boosted = gray < 105 ? 0 : gray > 175 ? 255 : (gray - 105) * 3.64;
                    pixels.data[i] = pixels.data[i + 1] = pixels.data[i + 2] = boosted;
                }
                ctx.putImageData(pixels, 0, 0);
                var result = await (await worker()).recognize(image);
                return result && result.data ? result.data.text || "" : "";
            }
            async function tick() {
                var canvas = document.querySelector("#gameContainer canvas");
                if (scanning || !canvas || !canvas.width || !canvas.height || !window.Tesseract) return;
                scanning = true;
                try {
                    var screenText = await readCanvas(canvas);
                    setStatus("OCR running · watching for AGAIN / game-over screen");
                    var ended = isGameOver(screenText);
                    var liveScore = extractScore(screenText);
                    var hasLabeledScore = /(?:score|distance|points?)\\s*[:\\-]?\\s*[0-9]{1,9}/i.test(screenText);
                    if (hasLabeledScore && liveScore > 0) latestScore = liveScore;

                    // Require two consecutive end-screen reads to avoid false triggers.
                    endScreenHits = ended ? endScreenHits + 1 : 0;
                    if (endScreenHits >= 2 && !handled) {
                        handled = true;
                        var score = hasLabeledScore && liveScore > 0 ? liveScore : latestScore;
                        if (Number.isSafeInteger(score) && score > 0 && window.ArcadeScores && window.ArcadeScores.configured) {
                            var submitted = await window.ArcadeScores.promptAndSubmit("Slope", score);
                            setStatus(submitted ? "score submitted" : "score submission cancelled or failed");
                        } else if (!window.ArcadeScores || !window.ArcadeScores.configured) {
                            promptOcrIssue("Game over detected, but the leaderboard connection is unavailable.");
                        } else {
                            promptOcrIssue("Game over detected, but OCR could not read the score.");
                        }
                    } else if (!ended && handled) {
                        handled = false;
                        endScreenHits = 0;
                        latestScore = null;
                    }
                } catch (e) {
                    console.warn("Slope leaderboard detection failed:", e);
                    promptOcrIssue("OCR failed: " + (e && e.message ? e.message : "unknown error"));
                } finally {
                    scanning = false;
                }
            }
            // No manual score entry: only scores detected from the game canvas are submitted.
            // This prevents casual score fabrication through the page UI, but client-side
            // OCR is not tamper-proof; strong anti-cheat requires server-side validation.

            // OCR is optional; keep the manual submit button available even if OCR or
            // leaderboard configuration is unavailable.
            if (leaderboardReady) {
              var script = document.createElement("script");
              script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
              script.async = true;
              script.onload = function () { setStatus("OCR loaded · watching game"); window.setInterval(tick, 900); };
              script.onerror = function () { console.warn("Slope leaderboard OCR could not load."); promptOcrIssue("Tesseract failed to load. Check connection and reload."); };
              document.head.appendChild(script);
            }
          }
          // This script is in the document head; wait until body exists before adding controls.
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", connectSlopeLeaderboard, { once: true });
          } else {
            connectSlopeLeaderboard();
          }
        })();
    </script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div class="webgl-content">
        <div id="gameContainer" style="width: 100%; height: 100%; margin: 0;"></div>
    </div>
</body>
</html>
