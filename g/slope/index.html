<html>
<head>
<script src="/js/favicon.js"></script>
<script src="/js/panic.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-X514E26P5B"></script>
<script src="/js/gtag.js"></script>
  <script src="/js/arcade-score-config.js"></script>
<script src="/js/arcade-scores.js"></script>
  <script src="/js/timeTracker.js" defer></script>
<script src="/js/auto-clicker.js"></script>
<title>Grades & Attendence</title>
<link rel="icon" type="image/x-icon" href="/images/favicon.png">
<link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="TemplateData/unityloader41.js"></script>
    <script>
        // Keep the Unity WebGL drawing buffer readable so the leaderboard can
        // inspect the actual end-of-run screen instead of guessing from storage.
        (function () {
            var originalGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function (type, attributes) {
                var isWebGL = /webgl/i.test(String(type));
                var inSlopeGame = this.parentElement && (this.parentElement.id === "gameContainer" || this.parentElement.closest("#gameContainer"));
                if (isWebGL && inSlopeGame) {
                    attributes = Object.assign({}, attributes || {}, { preserveDrawingBuffer: true });
                }
                return originalGetContext.call(this, type, attributes);
            };
        })();

        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/slope.json", { onProgress: UnityProgress, Module: { onRuntimeInitialized: function() { UnityProgress(gameInstance, "complete") } } });

        // Slope is a Unity game without a JavaScript score API. Read its real
        // end screen with OCR, then submit the displayed run score.
        (function connectSlopeCanvasOCR() {
            if (!window.ArcadeScores || !window.ArcadeScores.configured) return;
            var workerPromise = null;
            var scanning = false;
            var lastScreen = "";
            var lastSubmittedScreen = "";
            var submittedBest = 0;
            try { submittedBest = Number(localStorage.getItem("arcadeSlopeSubmittedBest") || 0); } catch (e) {}

            function getCanvas() {
                return document.querySelector("#gameContainer canvas");
            }
            function getWorker() {
                if (!workerPromise) workerPromise = window.Tesseract.createWorker("eng");
                return workerPromise;
            }
            function clean(value) {
                return String(value || "").toLowerCase().replace(/[^a-z0-9\\s:]/g, " ").replace(/\\s+/g, " ").trim();
            }
            function readScore(text) {
                var normalized = String(text || "").replace(/,/g, "");
                var patterns = [
                    /(?:your\\s+)?score\\s*[:\\-]?\\s*([0-9]{1,9})/i,
                    /distance\\s*[:\\-]?\\s*([0-9]{1,9})/i,
                    /([0-9]{1,9})\\s*(?:m|meters|metres|points|pts)\\b/i
                ];
                for (var i = 0; i < patterns.length; i++) {
                    var match = normalized.match(patterns[i]);
                    if (match) {
                        var score = Number(match[1]);
                        if (Number.isSafeInteger(score) && score > 0 && score <= 100000000) return score;
                    }
                }
                return 0;
            }
            function isGameOver(text) {
                var value = clean(text);
                return /game\\s*over|try\\s*again|play\\s*again|you\\s*crashed|crashed|restart/.test(value);
            }
            async function scan() {
                var canvas = getCanvas();
                if (scanning || !canvas || !canvas.width || !canvas.height || !window.Tesseract) return;
                scanning = true;
                try {
                    var snapshot = document.createElement("canvas");
                    var scale = Math.min(1, 1100 / Math.max(canvas.width, canvas.height));
                    snapshot.width = Math.max(1, Math.round(canvas.width * scale));
                    snapshot.height = Math.max(1, Math.round(canvas.height * scale));
                    var context = snapshot.getContext("2d", { willReadFrequently: true });
                    context.drawImage(canvas, 0, 0, snapshot.width, snapshot.height);
                    var result = await (await getWorker()).recognize(snapshot);
                    var text = result && result.data ? result.data.text : "";
                    var normalized = clean(text);
                    if (!isGameOver(text)) {
                        lastScreen = "";
                        return;
                    }
                    var score = readScore(text);
                    if (!score || score <= submittedBest) return;
                    var key = normalized + "|" + score;
                    if (key === lastSubmittedScreen) return;
                    if (key === lastScreen || !lastScreen) {
                        lastScreen = key;
                        var submitted = await window.ArcadeScores.promptAndSubmit("Slope", score);
                        if (submitted) {
                            submittedBest = score;
                            lastSubmittedScreen = key;
                            try { localStorage.setItem("arcadeSlopeSubmittedBest", String(score)); } catch (e) {}
                        }
                    } else {
                        lastScreen = key;
                    }
                } catch (error) {
                    console.warn("Slope visual score detection failed:", error);
                } finally {
                    scanning = false;
                }
            }

            var script = document.createElement("script");
            script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
            script.async = true;
            script.onload = function () { window.setInterval(scan, 2500); };
            script.onerror = function () { console.warn("Slope OCR library could not be loaded."); };
            document.head.appendChild(script);
        })();
    </script>("gameContainer", "Build/slope.json", { onProgress: UnityProgress, Module: { onRuntimeInitialized: function() { UnityProgress(gameInstance, "complete") } } });
    </script>
<script src="/js/arcade-score-config.js"></script>
<script src="/js/arcade-scores.js"></script>
<script src="/js/arcade-manual-score.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div class="webgl-content">
        <div id="gameContainer" style="width: 100%; height: 100%; margin: 0;"></div>
    </div>
</body>
</html>
