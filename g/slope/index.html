<html>
<head>
<script src="../../js/favicon.js"></script>
<script src="../../js/panic.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-X514E26P5B"></script>
<script src="../../js/gtag.js"></script>
  <script src="../../js/arcade-score-config.js?v=2"></script>
<script src="../../js/arcade-scores.js?v=2"></script>
  <script src="../../js/timeTracker.js" defer></script>
<script src="../../js/auto-clicker.js"></script>
<title>Grades & Attendence</title>
<link rel="icon" type="image/x-icon" href="../../images/favicon.png">
<link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="TemplateData/unityloader41.js"></script>
    <script>
        // Preserve Unity's canvas so the leaderboard detector can inspect the end screen.
        (function () {
            var originalGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function (type, attributes) {
                if (/webgl/i.test(String(type)) && this.closest && this.closest("#gameContainer")) {
                    attributes = Object.assign({}, attributes || {}, { preserveDrawingBuffer: true });
                }
                return originalGetContext.call(this, type, attributes);
            };
        })();

        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/slope.json", {
            onProgress: UnityProgress,
            Module: { onRuntimeInitialized: function () { UnityProgress(gameInstance, "complete"); } }
        });

        (function () {
          function connectSlopeLeaderboard() {
            var leaderboardReady = !!(window.ArcadeScores && window.ArcadeScores.configured);
            var workerPromise = null, scanning = false, handled = false;
            var endScreenHits = 0, latestScore = 0, maxScore = 0, lastPromptAt = 0;
            var gameStarted = false, scoreCandidate = null, scoreCandidateHits = 0;
            var status = document.createElement("div");
            status.id = "slope-ocr-status";
            status.style.cssText = "position:fixed;left:10px;bottom:10px;z-index:2147483647;padding:8px 11px;border-radius:8px;background:#101525;color:#fff;border:1px solid #6bffd9;font:12px sans-serif;max-width:min(90vw,420px);";
            status.textContent = "Slope leaderboard: loading automatic detector.";
            document.body.appendChild(status);
            function setStatus(message) { status.textContent = "Slope leaderboard: " + message; }
            function promptOcrIssue(message) {
              setStatus(message);
              var now = Date.now();
              if (now - lastPromptAt > 60000) {
                lastPromptAt = now;
                window.alert("Slope leaderboard: " + message + "\\n\\nReload Slope and try another run.");
              }
            }
            function worker() {
                if (!workerPromise) workerPromise = window.Tesseract.createWorker("eng");
                return workerPromise;
            }
            function normalized(s) {
                return String(s || "").toLowerCase().replace(/[^a-z0-9\\s]/g, " ").replace(/\\s+/g, " ").trim();
            }
            // The in-game Leaderboard control appears on Slope's run-ended screen.
            // Require repeated OCR hits AND a detected run to avoid triggering on load.
            function isRunEnded(s) {
                var t = normalized(s);
                return /leader ?board|play again|try again|game over|you crashed/.test(t);
            }
            function extractScore(s) {
                var nums = String(s || "").replace(/,/g, "").match(/\\b[0-9]{1,8}\\b/g) || [];
                if (!nums.length) return 0;
                // The HUD crop is digits-only, so choose the longest token first;
                // this avoids treating a stray single digit as the run distance.
                nums.sort(function(a,b) { return b.length - a.length || Number(b) - Number(a); });
                return Number(nums[0]) || 0;
            }
            async function recognizeCanvas(canvas, cropTopRatio, cropHeightRatio, digitsOnly) {
                var image = document.createElement("canvas");
                var sourceY = Math.round(canvas.height * cropTopRatio);
                var sourceHeight = Math.max(1, Math.round(canvas.height * cropHeightRatio));
                var scale = Math.min(4, 3000 / canvas.width);
                image.width = Math.max(1, Math.round(canvas.width * scale));
                image.height = Math.max(1, Math.round(sourceHeight * scale));
                var ctx = image.getContext("2d", { willReadFrequently: true });
                ctx.drawImage(canvas, 0, sourceY, canvas.width, sourceHeight, 0, 0, image.width, image.height);
                var pixels = ctx.getImageData(0, 0, image.width, image.height);
                for (var i = 0; i < pixels.data.length; i += 4) {
                    var gray = pixels.data[i] * 0.299 + pixels.data[i + 1] * 0.587 + pixels.data[i + 2] * 0.114;
                    var boosted = gray < 115 ? 0 : gray > 165 ? 255 : (gray - 115) * 5.1;
                    pixels.data[i] = pixels.data[i + 1] = pixels.data[i + 2] = boosted;
                }
                ctx.putImageData(pixels, 0, 0);
                var w = await worker();
                // Set parameters immediately before each recognition; this worker is
                // used serially by tick(), preventing OCR mode leakage between scans.
                if (digitsOnly) await w.setParameters({ tessedit_char_whitelist: "0123456789,", tessedit_pageseg_mode: "11" });
                else await w.setParameters({ tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789", tessedit_pageseg_mode: "11" });
                var result = await w.recognize(image);
                return result && result.data ? result.data.text || "" : "";
            }
            async function readHudScore(canvas) {
                // Scan a wider top HUD band to tolerate different canvas scaling.
                return extractScore(await recognizeCanvas(canvas, 0, 0.30, true));
            }
            async function readGameState(canvas) {
                return await recognizeCanvas(canvas, 0, 1, false);
            }
            async function tick() {
                var canvas = document.querySelector("#gameContainer canvas");
                if (scanning || !canvas || !canvas.width || !canvas.height || !window.Tesseract) return;
                scanning = true;
                try {
                    var liveScore = await readHudScore(canvas);
                    var screenText = await readGameState(canvas);
                    var ended = isRunEnded(screenText);
                    // A run is armed only after a real HUD score is seen. Confirm
                    // score readings on two scans before accepting a new value.
                    if (!ended && liveScore > 0) {
                        if (scoreCandidate !== null && Math.abs(liveScore - scoreCandidate) <= Math.max(3, scoreCandidate * 0.15)) {
                            scoreCandidateHits++;
                        } else {
                            scoreCandidate = liveScore;
                            scoreCandidateHits = 1;
                        }
                        if (scoreCandidateHits >= 2) {
                            gameStarted = true;
                            latestScore = liveScore;
                            if (liveScore > maxScore) maxScore = liveScore;
                        }
                    }
                    endScreenHits = (gameStarted && ended) ? endScreenHits + 1 : 0;
                    if (!gameStarted) {
                        setStatus("waiting for a run to start · automatic detection active");
                    } else if (!ended) {
                        setStatus("RUNNING · current " + (latestScore || liveScore || "reading") + " · best captured " + maxScore);
                    } else {
                        setStatus("end screen detected · confirming result (" + endScreenHits + "/2)");
                    }
                    if (endScreenHits >= 2 && !handled) {
                        handled = true;
                        var score = Math.max(maxScore, latestScore);
                        if (score > 0 && Number.isSafeInteger(score) && leaderboardReady && window.ArcadeScores) {
                            setStatus("run ended · submitting captured score " + score);
                            var submitted = await window.ArcadeScores.promptAndSubmit("Slope", score);
                            setStatus(submitted ? "score submitted: " + score : "submission cancelled or failed");
                        } else if (!leaderboardReady) {
                            promptOcrIssue("The leaderboard connection is not configured; captured score was " + score + ".");
                        } else {
                            promptOcrIssue("The run ended, but no reliable score was captured.");
                        }
                    }
                    if (!ended && handled) {
                        handled = false;
                        endScreenHits = 0;
                        gameStarted = false;
                        latestScore = 0;
                        maxScore = 0;
                        scoreCandidate = null;
                        scoreCandidateHits = 0;
                    }
                } catch (e) {
                    console.warn("Slope leaderboard detection failed:", e);
                    setStatus("detector error · " + (e && e.message ? e.message : "OCR error"));
                } finally {
                    scanning = false;
                }
            }
            // No manual score entry: only scores detected from the game canvas are submitted.
            // This prevents casual score fabrication through the page UI, but client-side
            // OCR is not tamper-proof; strong anti-cheat requires server-side validation.

            // OCR is optional; keep the manual submit button available even if OCR or
            // leaderboard configuration is unavailable.
            {
              var script = document.createElement("script");
              script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
              script.async = true;
              script.onload = function () { setStatus(leaderboardReady ? "OCR loaded · automatic game detection active" : "OCR loaded · leaderboard config missing"); window.setInterval(tick, 1100); };
              script.onerror = function () { console.warn("Slope leaderboard OCR could not load."); promptOcrIssue("Tesseract failed to load. Check connection and reload."); };
              document.head.appendChild(script);
            }
          }
          // This script is in the document head; wait until body exists before adding controls.
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", connectSlopeLeaderboard, { once: true });
          } else {
            connectSlopeLeaderboard();
          }
        })();
    </script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div class="webgl-content">
        <div id="gameContainer" style="width: 100%; height: 100%; margin: 0;"></div>
    </div>
</body>
</html>
