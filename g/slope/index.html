        // Preserve Unity's canvas so the leaderboard detector can inspect the end screen.
        (function () {
            var originalGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function (type, attributes) {
                if (/webgl/i.test(String(type)) && this.closest && this.closest("#gameContainer")) {
                    attributes = Object.assign({}, attributes || {}, { preserveDrawingBuffer: true });
                }
                return originalGetContext.call(this, type, attributes);
            };
        })();

        // Best-effort guest mode: clear sign-in state before Unity starts.
        // This cannot remove a login screen compiled into the Unity game itself.
        (function forceGuestMode() {
            var authKey = /auth|login|account|user.?token|access.?token|refresh.?token|session/i;
            try {
                [window.localStorage, window.sessionStorage].forEach(function (store) {
                    if (!store) return;
                    var keys = [];
                    for (var i = 0; i < store.length; i++) {
                        var key = store.key(i);
                        if (key && authKey.test(key)) keys.push(key);
                    }
                    keys.forEach(function (key) { store.removeItem(key); });
                });
            } catch (e) {
                console.warn("Slope guest mode: could not clear web storage.", e);
            }
            try {
                document.cookie.split(";").forEach(function (cookie) {
                    var name = cookie.split("=")[0].trim();
                    if (authKey.test(name)) {
                        document.cookie = name + "=; Max-Age=0; path=/";
                        document.cookie = name + "=; Max-Age=0; path=/ToTuff4U/g/slope/";
                    }
                });
            } catch (e) {
                console.warn("Slope guest mode: could not clear cookies.", e);
            }
            // Remove only IndexedDB databases whose names clearly indicate auth data.
            try {
                if (window.indexedDB && indexedDB.databases) {
                    indexedDB.databases().then(function (databases) {
                        databases.forEach(function (database) {
                            if (database.name && authKey.test(database.name)) {
                                indexedDB.deleteDatabase(database.name);
                            }
                        });
                    }).catch(function () {});
                }
            } catch (e) {}
        })();

        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/slope.json", {
            onProgress: UnityProgress,
            Module: { onRuntimeInitialized: function () { UnityProgress(gameInstance, "complete"); } }
        });

        // Pause Unity's main loop whenever this page is not the active tab.
        // Unity's Emscripten runtime exposes pauseMainLoop/resumeMainLoop on Module.
        (function () {
            var pausedForBackground = false;
            function getUnityModule() {
                return gameInstance && gameInstance.Module;
            }
            function pauseForBackground() {
                if (pausedForBackground || !document.hidden && document.hasFocus()) return;
                var module = getUnityModule();
                if (module && typeof module.pauseMainLoop === "function") {
                    module.pauseMainLoop();
                    pausedForBackground = true;
                }
            }
            function resumeForForeground() {
                if (document.hidden || !document.hasFocus() || !pausedForBackground) return;
                var module = getUnityModule();
                if (module && typeof module.resumeMainLoop === "function") {
                    module.resumeMainLoop();
                    pausedForBackground = false;
                }
            }
            document.addEventListener("visibilitychange", function () {
                if (document.hidden) pauseForBackground();
                else resumeForForeground();
            });
            window.addEventListener("blur", pauseForBackground);
            window.addEventListener("focus", resumeForForeground);
            // The Unity runtime may finish initializing after the first focus event.
            window.addEventListener("load", function () {
                if (document.hidden || !document.hasFocus()) pauseForBackground();
            });
        })();

        (function () {
          function connectSlopeLeaderboard() {
            var leaderboardReady = !!(window.ArcadeScores && window.ArcadeScores.configured);
            var workerPromise = null, scanning = false, handled = false;
            var endScreenHits = 0, latestScore = 0, maxScore = 0, lastPromptAt = 0;
            var lastEndOcrDebug = 'not run';
            var gameStarted = false, scoreCandidate = null, scoreCandidateHits = 0, lastObservedScore = null, stoppedHits = 0;
            var endScoreCandidate = null, endScoreCandidateHits = 0;
            var status = document.createElement("div");
            status.id = "slope-ocr-status";
            status.style.cssText = "position:fixed;left:10px;bottom:10px;z-index:2147483647;padding:8px 11px;border-radius:8px;background:#101525;color:#fff;border:1px solid #6bffd9;font:12px sans-serif;max-width:min(90vw,420px);";
            status.textContent = "Slope leaderboard: loading automatic detector.";
            document.body.appendChild(status);
            function setStatus(message) { status.textContent = "Slope leaderboard: " + message; }
            function promptOcrIssue(message) {
              setStatus(message);
              var now = Date.now();
              if (now - lastPromptAt > 60000) {
                lastPromptAt = now;
                window.alert("Slope leaderboard: " + message + "\\n\\nReload Slope and try another run.");
              }
            }
            function worker() {
                if (!workerPromise) workerPromise = window.Tesseract.createWorker("eng");
                return workerPromise;
            }
            function normalized(s) {
                return String(s || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
            }
            // The in-game Leaderboard control appears on Slope's run-ended screen.
            // Require repeated OCR hits AND a detected run to avoid triggering on load.
            function isRunEnded(ocrResult) {
                // readGameState returns Tesseract's result object, not a string.
                // Read the recognized text explicitly; otherwise String(object)
                // becomes "[object Object]" and death screens are never detected.
                var data = ocrResult && ocrResult.data ? ocrResult.data : {};
                var rawText = data.text || "";
                if (!rawText && Array.isArray(data.words)) {
                    rawText = data.words.map(function (word) { return word.text || ""; }).join(" ");
                }
                var t = normalized(rawText);
                return /leader ?board|play again|try again|game over|you crashed|crash(ed)?|run over|restart|new game/.test(t);
            }
            function extractScore(result) {
                var data = result && result.data || {};
                var words = Array.isArray(data.words) ? data.words : [];
                var imageWidth = result && result.__ocrWidth || 1;
                var imageHeight = result && result.__ocrHeight || 1;
                var candidates = words.map(function(word) {
                    var raw = String(word.text || "").replace(/,/g, "").trim();
                    if (!/^\d{1,7}$/.test(raw)) return null;
                    var box = word.bbox || {};
                    return { value:Number(raw), digits:raw, confidence:Number(word.confidence)||0,
                      x0:Number(box.x0)||0,y0:Number(box.y0)||0,x1:Number(box.x1)||0,y1:Number(box.y1)||0 };
                }).filter(function(x) {
                    return x && x.value >= 1 && x.value <= 1500 && x.confidence >= 35 &&
                      (x.x1-x.x0) > 1 && (x.y1-x.y0) > 2;
                });
                // Some Tesseract builds return recognized text but no word boxes.
                // Accept a clean, isolated 1-4 digit result from the centered crop too.
                if (!candidates.length) {
                    // Tesseract can report page confidence 0 even when its text
                    // output contains readable digits but no word boxes.
                    var rawText = String(data.text || "").replace(/,/g, " ").trim();
                    var matches = rawText.match(/\d{1,4}/g) || [];
                    var textConfidence = Number(data.confidence);
                    if (!Number.isFinite(textConfidence) || textConfidence <= 0) textConfidence = 65;
                    matches.forEach(function(match) {
                        var digits = match.trim();
                        var value = Number(digits);
                        if (value >= 1 && value <= 1500) {
                            candidates.push({value:value,digits:digits,confidence:textConfidence,
                              x0:0,y0:0,x1:imageWidth,y1:imageHeight});
                        }
                    });
                }
                // Prefer the largest centered numeric token, not stray tiny counters.
                candidates.sort(function(a,b) {
                    var acx=((a.x0+a.x1)/2)/imageWidth, acy=((a.y0+a.y1)/2)/imageHeight;
                    var bcx=((b.x0+b.x1)/2)/imageWidth, bcy=((b.y0+b.y1)/2)/imageHeight;
                    var ad=Math.hypot(acx-0.5,acy-0.5), bd=Math.hypot(bcx-0.5,bcy-0.5);
                    return ad-bd || ((b.x1-b.x0)*(b.y1-b.y0)-(a.x1-a.x0)*(a.y1-a.y0)) || b.confidence-a.confidence;
                });
                return candidates[0] || {value:0,confidence:0};
            }
            async function recognizeCanvas(canvas, cropTopRatio, cropHeightRatio, digitsOnly, cropLeftRatio, cropWidthRatio, digitPageSegMode, preprocessMode) {
                var image = document.createElement("canvas");
                var sourceY = Math.round(canvas.height * cropTopRatio);
                var sourceHeight = Math.max(1, Math.round(canvas.height * cropHeightRatio));
                var sourceX = Math.round(canvas.width * (cropLeftRatio || 0));
                var sourceWidth = Math.max(1, Math.round(canvas.width * (cropWidthRatio || 1)));
                var scale = Math.min(5, 3200 / sourceWidth);
                image.width = Math.max(1, Math.round(sourceWidth * scale));
                image.height = Math.max(1, Math.round(sourceHeight * scale));
                var ctx = image.getContext("2d", { willReadFrequently: true });
                ctx.drawImage(canvas, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, image.width, image.height);
                var pixels = ctx.getImageData(0, 0, image.width, image.height);
                // Keep an unthresholded grayscale option: thresholding can erase
                // thin strokes in Slope's small score font (for example the "7" in 17).
                for (var i = 0; i < pixels.data.length; i += 4) {
                    var gray = pixels.data[i] * 0.299 + pixels.data[i + 1] * 0.587 + pixels.data[i + 2] * 0.114;
                    var boosted = preprocessMode === "gray" ? gray :
                        (gray < 105 ? 0 : gray > 175 ? 255 : (gray - 105) * 3.64);
                    if (preprocessMode === "invert") boosted = 255 - boosted;
                    pixels.data[i] = pixels.data[i + 1] = pixels.data[i + 2] = boosted;
                }
                ctx.putImageData(pixels, 0, 0);
                var w = await worker();
                if (digitsOnly) await w.setParameters({ tessedit_char_whitelist: "0123456789,", tessedit_pageseg_mode: String(digitPageSegMode || 7), preserve_interword_spaces: "0" });
                else await w.setParameters({ tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789", tessedit_pageseg_mode: "11" });
                var result = await w.recognize(image);
                result.__ocrWidth = image.width;
                result.__ocrHeight = image.height;
                return result;
            }
            async function readHudScore(canvas) {
                var result = await recognizeCanvas(canvas, 0.02, 0.18, true, 0.32, 0.36);
                return extractScore(result);
            }
            // Slope shows the final run score in the middle of its crash/end screen,
            // not in the live HUD crop. Scan that center region when the run ends.
            async function readEndScreenScore(canvas) {
                // The final score is centered on Slope's crash screen. Read that
                // region first so menu labels, counters and unrelated digits elsewhere
                // on the canvas cannot win the OCR selection.
                var result = await recognizeCanvas(canvas, 0.15, 0.70, true, 0.15, 0.70, 7);
                var best = extractScore(result);
                if (best && best.value > 0 && best.value <= 1500 && best.confidence >= 45) {
                    lastEndOcrDebug = "Center crop " + canvas.width + "x" + canvas.height +
                      " | " + String(result.data && result.data.text || "").replace(/\s+/g, " ").trim().slice(0, 80) +
                      " | pick=" + best.value + " (" + Math.round(best.confidence) + "%)";
                    window.__slopeOcrDebug = lastEndOcrDebug;
                    return best;
                }

                // Fallback only when the focused pass cannot find a confident score.
                // A second segmentation mode handles cases where the digits are split.
                var alternate = await recognizeCanvas(canvas, 0, 1, true, 0, 1, 6);
                var alternateBest = extractScore(alternate);
                var chosen = alternateBest;
                if (!chosen || chosen.value <= 0 || chosen.value > 1500 || chosen.confidence < 45) {
                    var grayscale = await recognizeCanvas(canvas, 0.15, 0.70, true, 0.15, 0.70, 7, "gray");
                    chosen = extractScore(grayscale);
                }
                lastEndOcrDebug = "Canvas " + canvas.width + "x" + canvas.height +
                  " | Center=" + String(result.data && result.data.text || "").replace(/\s+/g, " ").trim().slice(0, 45) +
                  " | Full=" + String(alternate.data && alternate.data.text || "").replace(/\s+/g, " ").trim().slice(0, 45) +
                  " | pick=" + (chosen && chosen.value || 0) +
                  " (" + Math.round(chosen && chosen.confidence || 0) + "%)";
                window.__slopeOcrDebug = lastEndOcrDebug;
                console.info("Slope end-screen OCR diagnostics:", lastEndOcrDebug);
                return chosen && chosen.value > 0 && chosen.value <= 1500 && chosen.confidence >= 45
                    ? chosen : { value: 0, confidence: 0 };
            }
            async function readGameState(canvas) {
                return await recognizeCanvas(canvas, 0, 1, false);
            }
            // Detect actual gameplay motion independently of score OCR. The title,
            // menu and leaderboard can have no readable score, so compare small
            // canvas snapshots across scans and require sustained movement.
            var previousFrame = null, motionHits = 0;
            function detectGameplayMotion(canvas) {
                // Focus on the middle of the game scene, where the run score and
                // crash overlay appear. Ignore borders and page/UI elements.
                var sample = document.createElement("canvas");
                // Inspect an exact 300×300-pixel region centered in the game canvas.
                // If the canvas is smaller than 300px in either dimension, use its full
                // available dimension while keeping the crop centered.
                var sourceWidth = Math.min(300, canvas.width);
                var sourceHeight = Math.min(300, canvas.height);
                var sourceX = Math.floor((canvas.width - sourceWidth) / 2);
                var sourceY = Math.floor((canvas.height - sourceHeight) / 2);
                sample.width = 300;
                sample.height = 300;
                var ctx = sample.getContext("2d", { willReadFrequently: true });
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = "high";
                ctx.drawImage(canvas, sourceX, sourceY, sourceWidth, sourceHeight,
                    0, 0, sample.width, sample.height);
                var pixels = ctx.getImageData(0, 0, sample.width, sample.height).data;
                var current = new Uint8Array(sample.width * sample.height);
                for (var i = 0, j = 0; i < pixels.length; i += 4) {
                    current[j++] = Math.round(
                        pixels[i] * 0.299 + pixels[i + 1] * 0.587 + pixels[i + 2] * 0.114
                    );
                }
                if (!previousFrame) {
                    previousFrame = current;
                    return false;
                }
                var changed = 0, totalDelta = 0;
                for (var k = 0; k < current.length; k++) {
                    var delta = Math.abs(current[k] - previousFrame[k]);
                    totalDelta += delta;
                    if (delta > 10) changed++;
                }
                previousFrame = current;
                var changedRatio = changed / current.length;
                var averageDelta = totalDelta / current.length;
                // Central crop + higher pixel count detects small movement around
                // the player/score without being distracted by page edges.
                return changedRatio > 0.018 && averageDelta > 2.8;
            }
            async function tick() {
                var canvas = document.querySelector("#gameContainer canvas");
                if (scanning || !canvas || !canvas.width || !canvas.height || !window.Tesseract) return;
                scanning = true;
                try {
                    var moving = detectGameplayMotion(canvas);
                    // Keep OCR completely off the CPU while the player is moving.
                    // Pixel motion sampling is much cheaper than running Tesseract.
                    motionHits = moving ? motionHits + 1 : 0;
                    if (motionHits >= 3) gameStarted = true;

                    // Check for the end screen as soon as the first still frame appears.
                    // The explicit end-screen text is strong evidence; stillness alone
                    // takes a few more samples so a brief pause during play won't end a run.
                    stoppedHits = gameStarted && !moving ? stoppedHits + 1 : 0;
                    var textEnded = false;
                    if (gameStarted && !moving && stoppedHits >= 1) {
                        var screenText = await readGameState(canvas);
                        textEnded = isRunEnded(screenText);
                    }

                    // Faster stillness fallback: 3 half-second samples instead of 4
                    // 1.1-second samples. Text-confirmed death can submit immediately.
                    var ended = textEnded || (gameStarted && stoppedHits >= 3);
                    if (ended && gameStarted) {
                        var endScoreReading = await readEndScreenScore(canvas);
                        // Require a capped, confident score to match across two distinct frames.
                        if (endScoreReading.value > 0 && endScoreReading.value <= 1500 &&
                            Number(endScoreReading.confidence) >= 55) {
                            if (endScoreCandidate === endScoreReading.value) endScoreCandidateHits++;
                            else { endScoreCandidate = endScoreReading.value; endScoreCandidateHits = 1; }
                            if (endScoreCandidateHits >= 2) {
                                maxScore = Math.max(maxScore, endScoreCandidate);
                                latestScore = Math.max(latestScore, endScoreCandidate);
                            }
                        } else {
                            endScoreCandidate = null;
                            endScoreCandidateHits = 0;
                        }
                    }
                    if (!gameStarted) setStatus("waiting for gameplay motion (" + motionHits + "/3)");
                    else if (!ended) setStatus("PLAYING · waiting for death screen to read score" + (stoppedHits ? " · stillness " + stoppedHits + "/6" : " · motion detected"));
                    else setStatus("DEATH / RUN END DETECTED · confirming (" + endScreenHits + "/2)");
                    endScreenHits = ended ? endScreenHits + 1 : 0;

                    if ((textEnded || endScreenHits >= 2) && !handled) {
                        handled = true;
                        var score = maxScore || 0;
                        if (score > 0 && leaderboardReady && window.ArcadeScores) {
                            setStatus("game ended · submitting detected score " + score);
                            var playerName = window.ArcadeScores.getPlayerName("Enter your name for the Slope leaderboard (24 characters max):");
                            if (playerName) {
                                var submitted = await window.ArcadeScores.submit("Slope", score, playerName);
                                setStatus(submitted ? "score submitted: " + score : "score submission failed");
                            } else {
                                setStatus("name entry cancelled · score not submitted");
                            }
                        } else if (!leaderboardReady) {
                            promptOcrIssue("Leaderboard connection is not configured.");
                        } else {
                            promptOcrIssue("Score could not be read confidently. No score was submitted. OCR details: " + lastEndOcrDebug);
                        }
                    }
                    if (!ended && handled) {
                        handled=false; endScreenHits=0; gameStarted=false;
                        latestScore=0; maxScore=0; scoreCandidate=null;
                        scoreCandidateHits=0; lastObservedScore=null; stoppedHits=0;
                        endScoreCandidate=null; endScoreCandidateHits=0;
                        motionHits=0; previousFrame=null;
                    }
                } catch (e) {
                    console.warn("Slope leaderboard detection failed:",e);
                    setStatus("detector error · "+(e && e.message ? e.message : "OCR error"));
                } finally { scanning=false; }
            }
            // No manual score entry: only scores detected from the game canvas are submitted.
            // This prevents casual score fabrication through the page UI, but client-side
            // OCR is not tamper-proof; strong anti-cheat requires server-side validation.

            // OCR is optional; keep the manual submit button available even if OCR or
            // leaderboard configuration is unavailable.
            {
              var script = document.createElement("script");
              script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
              script.async = true;
              script.onload = function () { setStatus(leaderboardReady ? "OCR loaded · faster automatic death detection active" : "OCR loaded · leaderboard config missing"); window.setInterval(tick, 500); };
              script.onerror = function () { console.warn("Slope leaderboard OCR could not load."); promptOcrIssue("Tesseract failed to load. Check connection and reload."); };
              document.head.appendChild(script);
            }
          }
          // This script is in the document head; wait until body exists before adding controls.
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", connectSlopeLeaderboard, { once: true });
          } else {
            connectSlopeLeaderboard();
          }
        })();
    </script>
