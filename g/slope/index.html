<title>Grades & Attendence</title>
<link rel="icon" type="image/x-icon" href="/images/favicon.png">
<link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="TemplateData/unityloader41.js"></script>
    <script>
        // Keep the Unity WebGL drawing buffer readable so the leaderboard can
        // inspect the actual end-of-run screen instead of guessing from storage.
        (function () {
            var originalGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function (type, attributes) {
                var isWebGL = /webgl/i.test(String(type));
                var inSlopeGame = this.parentElement && (this.parentElement.id === "gameContainer" || this.parentElement.closest("#gameContainer"));
                if (isWebGL && inSlopeGame) {
                    attributes = Object.assign({}, attributes || {}, { preserveDrawingBuffer: true });
                }
                return originalGetContext.call(this, type, attributes);
            };
        })();

        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/slope.json", { onProgress: UnityProgress, Module: { onRuntimeInitialized: function() { UnityProgress(gameInstance, "complete") } } });
    </script>
<script src="/js/arcade-score-config.js"></script>
<script src="/js/arcade-scores.js"></script>
<script src="/js/arcade-manual-score.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div class="webgl-content">
        <div id="gameContainer" style="width: 100%; height: 100%; margin: 0;"></div>
    </div>
</body>
