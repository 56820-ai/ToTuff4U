    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="TemplateData/unityloader41.js"></script>
    <script>
        // Preserve Unity's canvas so the leaderboard detector can inspect the end screen.
        (function () {
            var originalGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function (type, attributes) {
                if (/webgl/i.test(String(type)) && this.closest && this.closest("#gameContainer")) {
                    attributes = Object.assign({}, attributes || {}, { preserveDrawingBuffer: true });
                }
                return originalGetContext.call(this, type, attributes);
            };
        })();

        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/slope.json", {
            onProgress: UnityProgress,
            Module: { onRuntimeInitialized: function () { UnityProgress(gameInstance, "complete"); } }
        });

        (function () {
          function connectSlopeLeaderboard() {
            var leaderboardReady = !!(window.ArcadeScores && window.ArcadeScores.configured);
            var workerPromise = null, scanning = false, handled = false;
            var endScreenHits = 0, latestScore = 0, maxScore = 0, lastPromptAt = 0;
            var gameStarted = false, scoreCandidate = null, scoreCandidateHits = 0, lastObservedScore = null, stoppedHits = 0;
            var status = document.createElement("div");
            status.id = "slope-ocr-status";
            status.style.cssText = "position:fixed;left:10px;bottom:10px;z-index:2147483647;padding:8px 11px;border-radius:8px;background:#101525;color:#fff;border:1px solid #6bffd9;font:12px sans-serif;max-width:min(90vw,420px);";
            status.textContent = "Slope leaderboard: loading automatic detector.";
            document.body.appendChild(status);
            function setStatus(message) { status.textContent = "Slope leaderboard: " + message; }
            function promptOcrIssue(message) {
              setStatus(message);
              var now = Date.now();
              if (now - lastPromptAt > 60000) {
                lastPromptAt = now;
                window.alert("Slope leaderboard: " + message + "\\n\\nReload Slope and try another run.");
              }
            }
            function worker() {
                if (!workerPromise) workerPromise = window.Tesseract.createWorker("eng");
                return workerPromise;
            }
            function normalized(s) {
                return String(s || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
            }
            // The in-game Leaderboard control appears on Slope's run-ended screen.
            // Require repeated OCR hits AND a detected run to avoid triggering on load.
            function isRunEnded(s) {
                var t = normalized(s);
                return /leader ?board|play again|try again|game over|you crashed/.test(t);
            }
            function extractScore(result) {
                var words = result && result.data && result.data.words || [];
                var imageWidth = result && result.__ocrWidth || 1;
                var imageHeight = result && result.__ocrHeight || 1;
                var candidates = words.map(function(word) {
                    var raw = String(word.text || "").replace(/,/g, "").trim();
                    if (!/^\d{1,7}$/.test(raw)) return null;
                    var box = word.bbox || {};
                    return { value:Number(raw), confidence:Number(word.confidence)||0,
                      x0:Number(box.x0)||0,y0:Number(box.y0)||0,x1:Number(box.x1)||0,y1:Number(box.y1)||0 };
                }).filter(function(x) {
                    return x && x.value >= 1 && x.confidence >= 30 &&
                      (x.x1-x.x0) > 3 && (x.y1-x.y0) > 4;
                });
                // On the end screen, score is a large centered number. Prefer
                // the OCR token whose bounding-box center is closest to canvas
                // center, then larger glyphs, rather than confidence alone.
                candidates.sort(function(a,b) {
                    var acx=((a.x0+a.x1)/2)/imageWidth, acy=((a.y0+a.y1)/2)/imageHeight;
                    var bcx=((b.x0+b.x1)/2)/imageWidth, bcy=((b.y0+b.y1)/2)/imageHeight;
                    var ad=Math.hypot(acx-0.5,acy-0.5), bd=Math.hypot(bcx-0.5,bcy-0.5);
                    return ad-bd || ((b.x1-b.x0)*(b.y1-b.y0)-(a.x1-a.x0)*(a.y1-a.y0)) || b.confidence-a.confidence;
                });
                return candidates[0] || {value:0,confidence:0};
            }
            async function recognizeCanvas(canvas, cropTopRatio, cropHeightRatio, digitsOnly, cropLeftRatio, cropWidthRatio) {
                var image = document.createElement("canvas");
                var sourceY = Math.round(canvas.height * cropTopRatio);
                var sourceHeight = Math.max(1, Math.round(canvas.height * cropHeightRatio));
                var sourceX = Math.round(canvas.width * (cropLeftRatio || 0));
                var sourceWidth = Math.max(1, Math.round(canvas.width * (cropWidthRatio || 1)));
                var scale = Math.min(5, 3200 / sourceWidth);
                image.width = Math.max(1, Math.round(sourceWidth * scale));
                image.height = Math.max(1, Math.round(sourceHeight * scale));
                var ctx = image.getContext("2d", { willReadFrequently: true });
                ctx.drawImage(canvas, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, image.width, image.height);
                var pixels = ctx.getImageData(0, 0, image.width, image.height);
                // High-contrast grayscale with a slightly softer threshold so thin
                // anti-aliased digits are not erased.
                for (var i = 0; i < pixels.data.length; i += 4) {
                    var gray = pixels.data[i] * 0.299 + pixels.data[i + 1] * 0.587 + pixels.data[i + 2] * 0.114;
                    var boosted = gray < 105 ? 0 : gray > 175 ? 255 : (gray - 105) * 3.64;
                    pixels.data[i] = pixels.data[i + 1] = pixels.data[i + 2] = boosted;
                }
                ctx.putImageData(pixels, 0, 0);
                var w = await worker();
                if (digitsOnly) await w.setParameters({ tessedit_char_whitelist: "0123456789,", tessedit_pageseg_mode: "7", preserve_interword_spaces: "0" });
                else await w.setParameters({ tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789", tessedit_pageseg_mode: "11" });
                var result = await w.recognize(image);
                result.__ocrWidth = image.width;
                result.__ocrHeight = image.height;
                return result;
            }
            async function readHudScore(canvas) {
                var result = await recognizeCanvas(canvas, 0.02, 0.18, true, 0.32, 0.36);
                return extractScore(result);
            }
            // Slope shows the final run score in the middle of its crash/end screen,
            // not in the live HUD crop. Scan that center region when the run ends.
            async function readEndScreenScore(canvas) {
                // OCR the broad central half of the end screen: Slope's score
                // is visibly centered, and narrow crops can miss its font/scale.
                var result = await recognizeCanvas(canvas, 0.20, 0.60, true, 0.15, 0.70);
                return extractScore(result);
            }
            async function readGameState(canvas) {
                return await recognizeCanvas(canvas, 0, 1, false);
            }
            // Detect actual gameplay motion independently of score OCR. The title,
            // menu and leaderboard can have no readable score, so compare small
            // canvas snapshots across scans and require sustained movement.
            var previousFrame = null, motionHits = 0;
            function detectGameplayMotion(canvas) {
                var sample = document.createElement("canvas");
                sample.width = 24;
                sample.height = 14;
                var ctx = sample.getContext("2d", { willReadFrequently: true });
                ctx.drawImage(canvas, 0, 0, sample.width, sample.height);
                var pixels = ctx.getImageData(0, 0, sample.width, sample.height).data;
                var current = new Uint8Array(sample.width * sample.height * 3);
                for (var i = 0, j = 0; i < pixels.length; i += 4) {
                    current[j++] = pixels[i];
                    current[j++] = pixels[i + 1];
                    current[j++] = pixels[i + 2];
                }
                if (!previousFrame) {
                    previousFrame = current;
                    return false;
                }
                var changed = 0, totalDelta = 0;
                for (var k = 0; k < current.length; k += 3) {
                    var delta = Math.abs(current[k] - previousFrame[k]) +
                        Math.abs(current[k + 1] - previousFrame[k + 1]) +
                        Math.abs(current[k + 2] - previousFrame[k + 2]);
                    totalDelta += delta;
                    if (delta > 42) changed++;
                }
                previousFrame = current;
                var changedRatio = changed / (current.length / 3);
                var averageDelta = totalDelta / (current.length / 3);
                return changedRatio > 0.10 && averageDelta > 10;
            }
            async function tick() {
                var canvas = document.querySelector("#gameContainer canvas");
                if (scanning || !canvas || !canvas.width || !canvas.height || !window.Tesseract) return;
                scanning = true;
                try {
                    var moving = detectGameplayMotion(canvas);
                    var scoreReading = await readHudScore(canvas);
                    var liveScore = scoreReading.value;
                    var screenText = await readGameState(canvas);
                    var textEnded = isRunEnded(screenText);
                    motionHits = moving ? motionHits + 1 : 0;
                    if (motionHits >= 3) gameStarted = true;

                    if (gameStarted && !textEnded && liveScore > 0) {
                        if (scoreCandidate === liveScore) scoreCandidateHits++;
                        else { scoreCandidate = liveScore; scoreCandidateHits = 1; }
                        if (scoreCandidateHits >= 2 && (lastObservedScore === null || liveScore >= lastObservedScore)) {
                            lastObservedScore = liveScore;
                            latestScore = liveScore;
                            maxScore = Math.max(maxScore, liveScore);
                        }
                    } else if (liveScore === 0) {
                        scoreCandidate = null; scoreCandidateHits = 0;
                    }

                    // End detection does not depend on score OCR succeeding.
                    stoppedHits = gameStarted && !moving ? stoppedHits + 1 : 0;
                    var ended = textEnded || (gameStarted && stoppedHits >= 10);
                    if (ended && gameStarted) {
                        var endScoreReading = await readEndScreenScore(canvas);
                        if (endScoreReading.value > 0) {
                            maxScore = Math.max(maxScore, endScoreReading.value);
                            latestScore = Math.max(latestScore, endScoreReading.value);
                        }
                    }
                    if (!gameStarted) setStatus("waiting for gameplay motion");
                    else if (!ended) setStatus("RUNNING · score read " + (latestScore || "waiting") + " · best " + maxScore);
                    else setStatus("game ended · confirming (" + endScreenHits + "/2)");
                    endScreenHits = ended ? endScreenHits + 1 : 0;

                    if (endScreenHits >= 2 && !handled) {
                        handled = true;
                        var score = maxScore || latestScore;
                        if (score > 0 && leaderboardReady && window.ArcadeScores) {
                            setStatus("game ended · submitting score " + score);
                            var submitted = await window.ArcadeScores.submit("Slope", score, "Slope Player");
                            setStatus(submitted ? "score submitted: " + score : "submission cancelled or failed");
                        } else if (!leaderboardReady) {
                            promptOcrIssue("Leaderboard connection is not configured.");
                        } else {
                            promptOcrIssue("Game ended, but score OCR did not capture a valid score.");
                        }
                    }
                    if (!ended && handled) {
                        handled=false; endScreenHits=0; gameStarted=false;
                        latestScore=0; maxScore=0; scoreCandidate=null;
                        scoreCandidateHits=0; lastObservedScore=null; stoppedHits=0;
                        motionHits=0; previousFrame=null;
                    }
                } catch (e) {
                    console.warn("Slope leaderboard detection failed:",e);
                    setStatus("detector error · "+(e && e.message ? e.message : "OCR error"));
                } finally { scanning=false; }
            }
            // No manual score entry: only scores detected from the game canvas are submitted.
            // This prevents casual score fabrication through the page UI, but client-side
            // OCR is not tamper-proof; strong anti-cheat requires server-side validation.

            // OCR is optional; keep the manual submit button available even if OCR or
            // leaderboard configuration is unavailable.
            {
              var script = document.createElement("script");
              script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
              script.async = true;
              script.onload = function () { setStatus(leaderboardReady ? "OCR loaded · automatic game detection active" : "OCR loaded · leaderboard config missing"); window.setInterval(tick, 1100); };
              script.onerror = function () { console.warn("Slope leaderboard OCR could not load."); promptOcrIssue("Tesseract failed to load. Check connection and reload."); };
              document.head.appendChild(script);
            }
          }
          // This script is in the document head; wait until body exists before adding controls.
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", connectSlopeLeaderboard, { once: true });
          } else {
            connectSlopeLeaderboard();
          }
        })();
    </script>
