<script>
(function () {
  "use strict";

  // Drift Boss exposes the real run score in its own game state:
  // ig.game.lastScore. Capture it when the game transitions to GameOver.
  var installedGame = null;
  var capturedThisRun = false;
  var status = document.createElement("div");
  status.id = "driftboss-score-status";
  status.style.cssText = "position:fixed;left:10px;bottom:10px;z-index:2147483647;padding:8px 11px;border-radius:8px;background:#101525;color:#fff;border:1px solid #6bffd9;font:12px sans-serif;max-width:min(90vw,420px);pointer-events:none;";
  var lastStatus = "";

  function setStatus(message) {
    if (message !== lastStatus) {
      status.textContent = "Drift Boss leaderboard: " + message;
      lastStatus = message;
    }
  }

  function submitRunScore(score) {
    if (!Number.isSafeInteger(score) || score < 0) {
      setStatus("game score was unavailable · no score submitted");
      return;
    }
    setStatus("game file detected your run score: " + score + " · submitting");
    var api = window.ArcadeScores;
    if (!api || typeof api.submit !== "function") {
      setStatus("score system is unavailable · reload and try again");
      return;
    }
    var name = typeof api.getPlayerName === "function"
      ? api.getPlayerName("Enter your name for the Drift Boss leaderboard (24 characters max):")
      : "";
    if (!name) {
      setStatus("name entry cancelled · score not submitted");
      return;
    }
    Promise.resolve(api.submit("Drift Boss", score, name)).then(function (ok) {
      setStatus(ok ? "submitted this run's score: " + score : "score submission failed");
    }).catch(function (error) {
      console.error("Drift Boss score submission failed:", error);
      setStatus("score submission failed");
    });
  }

  function installScoreHook() {
    var game = window.ig && window.ig.game;
    if (!game || typeof game.goToLevel !== "function" || game === installedGame) return;

    installedGame = game;
    var originalGoToLevel = game.goToLevel;
    game.goToLevel = function (levelName) {
      var level = String(levelName || "").toLowerCase();
      if (level === "gameplay") capturedThisRun = false;

      // The game calls goToLevel("GameOver") only after its run has ended.
      // Read lastScore before the GameOver screen or next run can change it.
      var score = null;
      if (level === "gameover" && !capturedThisRun) {
        var rawScore = Number(this.lastScore);
        if (Number.isFinite(rawScore) && rawScore >= 0) {
          score = Math.round(rawScore);
          capturedThisRun = true;
        }
      }

      var result = originalGoToLevel.apply(this, arguments);
      if (score !== null) {
        setStatus("game over · direct score detected: " + score);
        window.setTimeout(function () { submitRunScore(score); }, 150);
      }
      return result;
    };

    setStatus("connected to Drift Boss game files · waiting for a run");
  }

  function start() {
    if (!document.body.contains(status)) document.body.appendChild(status);
    installScoreHook();
    window.setInterval(installScoreHook, 200);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start, { once: true });
  } else {
    start();
  }
})();
</script>
