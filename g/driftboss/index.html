<html>

<head>
<script src="/js/favicon.js"></script>
<script src="/js/panic.js"></script>
  <script src="/js/arcade-score-config.js"></script>
<script src="/js/arcade-scores.js"></script>
  <script src="/js/timeTracker.js" defer></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-X514E26P5B"></script>

<title>Grades & Attendence</title>
<link rel="icon" type="image/x-icon" href="/images/favicon.png">
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<meta name="robots" content="noindex, nofollow">
	<meta name="viewport" content="width=device-width,height=device-height, initial-scale=1, maximum-scale=1, user-scalable=0, minimal-ui"/>
	<meta name="apple-mobile-web-app-capable" content="yes">
	<link rel="stylesheet" type="text/css" href="game.css">
	<script type="text/javascript" src="game.js"></script>
<script>
(function () {
  "use strict";
  var workerPromise = null, scanning = false, submitted = false;
  var bestRunScore = 0, started = false, endScoreCandidate = null, endScoreCandidateHits = 0;
  var endScreenHits = 0, lastStatus = "";
  var status = document.createElement("div");
  status.id = "driftboss-ocr-status";
  status.style.cssText = "position:fixed;left:10px;bottom:10px;z-index:2147483647;padding:8px 11px;border-radius:8px;background:#101525;color:#fff;border:1px solid #6bffd9;font:12px sans-serif;max-width:min(90vw,420px);pointer-events:none;";
  function setStatus(message) {
    if (message !== lastStatus) { status.textContent = "Drift Boss leaderboard: " + message; lastStatus = message; }
  }
  function worker() {
    if (!workerPromise) workerPromise = window.Tesseract.createWorker("eng");
    return workerPromise;
  }
  function readTopScore(result, canvas) {
    var words = result && result.data && result.data.words || [];
    var candidates = words.map(function (word) {
      var raw = String(word.text || "").replace(/,/g, "").trim();
      var box = word.bbox || {};
      var x0 = Number(box.x0) || 0, y0 = Number(box.y0) || 0;
      var x1 = Number(box.x1) || 0, y1 = Number(box.y1) || 0;
      if (!/^\d{1,7}$/.test(raw) || Number(word.confidence) < 45) return null;
      // Drift Boss keeps the live run score in the top HUD. Ignore all numbers
      // below that strip (menus, buttons, and other game text).
      if (y1 > canvas.height * 0.28 || y1 <= y0 || x1 <= x0) return null;
      return { value: Number(raw), confidence: Number(word.confidence) || 0,
        x: (x0 + x1) / 2, y: (y0 + y1) / 2, width: x1 - x0, height: y1 - y0 };
    }).filter(Boolean);
    if (!candidates.length) return null;
    // Prefer the prominent number near the top-center of the game canvas.
    candidates.sort(function (a, b) {
      var da = Math.abs(a.x / canvas.width - 0.5) + Math.abs(a.y / canvas.height - 0.12) * 1.4;
      var db = Math.abs(b.x / canvas.width - 0.5) + Math.abs(b.y / canvas.height - 0.12) * 1.4;
      return da - db || (b.width * b.height) - (a.width * a.height) || b.confidence - a.confidence;
    });
    return candidates[0].value;
  }
  async function readCenterRunScore(canvas) {
    // On the Game Over screen Drift Boss shows the score for the run that
    // just ended around the middle of the game canvas. Do not read the
    // persistent best score from the top HUD.
    var crop = document.createElement("canvas");
    var sx = Math.round(canvas.width * 0.18);
    var sy = Math.round(canvas.height * 0.22);
    var sw = Math.max(1, Math.round(canvas.width * 0.64));
    var sh = Math.max(1, Math.round(canvas.height * 0.58));
    var scale = Math.min(5, 2400 / sw);
    crop.width = Math.max(1, Math.round(sw * scale));
    crop.height = Math.max(1, Math.round(sh * scale));
    var ctx = crop.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(canvas, sx, sy, sw, sh, 0, 0, crop.width, crop.height);
    var w = await worker();
    await w.setParameters({
      tessedit_char_whitelist: "0123456789,",
      tessedit_pageseg_mode: "11",
      preserve_interword_spaces: "0"
    });
    var result = await w.recognize(crop);
    var words = result && result.data && result.data.words || [];
    var picks = words.map(function (word) {
      var raw = String(word.text || "").replace(/,/g, "").trim();
      var box = word.bbox || {};
      var x0 = Number(box.x0) || 0, y0 = Number(box.y0) || 0;
      var x1 = Number(box.x1) || 0, y1 = Number(box.y1) || 0;
      if (!/^\d{1,7}$/.test(raw) || Number(word.confidence) < 50 ||
          x1 <= x0 || y1 <= y0) return null;
      var cx = (x0 + x1) / 2 / crop.width;
      var cy = (y0 + y1) / 2 / crop.height;
      return { value: Number(raw), confidence: Number(word.confidence),
        centerDistance: Math.hypot(cx - 0.5, cy - 0.5),
        area: (x1 - x0) * (y1 - y0) };
    }).filter(function (item) { return item && Number.isSafeInteger(item.value); });
    picks.sort(function (a, b) {
      return a.centerDistance - b.centerDistance || b.area - a.area || b.confidence - a.confidence;
    });
    return picks.length ? picks[0].value : null;
  }
  async function finishRun(runScore) {
    if (submitted || !started || !Number.isSafeInteger(runScore) || runScore < 0) return;
    submitted = true;
    setStatus("Game Over · submitting this run's score: " + runScore);
    var name = window.ArcadeScores && window.ArcadeScores.getPlayerName
      ? window.ArcadeScores.getPlayerName("Enter your name for the Drift Boss leaderboard (24 characters max):") : "";
    if (!name) { setStatus("name entry cancelled · score not submitted"); submitted = false; return; }
    var ok = await window.ArcadeScores.submit("Drift Boss", runScore, name);
    setStatus(ok ? "OCR submitted this run's score: " + runScore : "score submission failed");
  }
  async function scan() {
    if (scanning) return;
    var canvas = document.getElementById("canvas");
    if (!canvas || !canvas.width || !canvas.height || !window.Tesseract) return;
    scanning = true;
    try {
      var image = document.createElement("canvas");
      var scale = Math.min(3, 2400 / canvas.width);
      image.width = Math.max(1, Math.round(canvas.width * scale));
      image.height = Math.max(1, Math.round(canvas.height * scale));
      var ctx = image.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(canvas, 0, 0, image.width, image.height);
      var w = await worker();
      await w.setParameters({
        tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789,:. ",
        tessedit_pageseg_mode: "11",
        preserve_interword_spaces: "1"
      });
      var result = await w.recognize(image);
      var score = readTopScore(result, image);
      var text = String(result.data && result.data.text || "").toLowerCase().replace(/\s+/g, " ");
      if (score !== null && score > 0) {
        started = true;
        setStatus("live HUD · " + score + " · waiting for Game Over");
      }
      // Only enter final-score mode after an actual end-screen label is seen.
      var endWords = /game\s*over|try\s*again|play\s*again/.test(text);
      if (endWords) endScreenHits++;
      else if (!endScreenHits) endScreenHits = 0;
      if (started && !submitted && endScreenHits >= 1) {
        setStatus("Game Over detected · reading this run's score in the center");
        var runScore = await readCenterRunScore(canvas);
        if (runScore !== null) {
          if (runScore === endScoreCandidate) endScoreCandidateHits++;
          else { endScoreCandidate = runScore; endScoreCandidateHits = 1; }
          setStatus("center score detected · " + runScore + " (" + endScoreCandidateHits + "/2)");
          if (endScoreCandidateHits >= 2) await finishRun(runScore);
        } else {
          endScoreCandidate = null;
          endScoreCandidateHits = 0;
          setStatus("Game Over detected · scanning center for this run's score");
        }
      }
      // Reset only after the Game Over overlay has disappeared and a new
      // positive live HUD score appears. The previous run's best is not reused.
      if (submitted && !endWords && score !== null && score > 0) {
        submitted = false; started = true; bestRunScore = score;
        endScreenHits = 0; endScoreCandidate = null; endScoreCandidateHits = 0;
        setStatus("new run detected · watching live HUD");
      }
    } catch (error) {
      console.warn("Drift Boss leaderboard OCR failed:", error);
      setStatus("OCR error · " + (error && error.message ? error.message : "could not read canvas"));
    } finally { scanning = false; }
  }
  function start() {
    if (!document.body.contains(status)) document.body.appendChild(status);
    var script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    script.async = true;
    script.onload = function () {
      setStatus("OCR loaded · watching live score and Game Over screen");
      window.setInterval(scan, 900);
    };
    script.onerror = function () { setStatus("Tesseract failed to load · check connection and reload"); };
    document.head.appendChild(script);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start, { once: true });
  else start();
})();
</script>
