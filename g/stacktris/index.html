<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stacktris</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
iframe{display:block;width:100%;height:100%;border:0}
#stacktris-score-status{position:fixed;z-index:99999;left:8px;top:8px;padding:6px 9px;border-radius:6px;background:rgba(0,0,0,.78);color:#fff;font:12px/1.35 Arial,sans-serif;pointer-events:none;max-width:85vw}
</style>
<script src="../../js/arcade-score-config.js"></script>
<script src="../../js/arcade-scores.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<iframe id="stacktris-game" src="../stacktris-main/index.html" title="Stacktris" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
<div id="stacktris-score-status">Leaderboard: waiting for Stacktris…</div>
<script>
(function(){
  "use strict";
  const frame=document.getElementById("stacktris-game");
  const status=document.getElementById("stacktris-score-status");
  let worker=null, scanning=false, lastOcrAt=0, lastText="";
  let candidateScore=null, candidateCount=0, lastSubmittedScore=null;
  function setStatus(message){status.textContent="Leaderboard: "+message;}

  // Stacktris/Fancade can place its score in different parts of the HUD.
  // Read the entire game canvas instead of assuming the score is bottom-center.
  function prepareCanvas(source,threshold){
    const maxWidth=1500, maxHeight=1100;
    const scale=Math.min(maxWidth/source.width,maxHeight/source.height);
    const width=Math.max(1,Math.round(source.width*scale));
    const height=Math.max(1,Math.round(source.height*scale));
    const canvas=document.createElement("canvas");
    canvas.width=width; canvas.height=height;
    const ctx=canvas.getContext("2d",{willReadFrequently:true});
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,width,height);
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
    ctx.drawImage(source,0,0,width,height);
    if(threshold){
      const image=ctx.getImageData(0,0,width,height);
      for(let i=0;i<image.data.length;i+=4){
        const gray=image.data[i]*.299+image.data[i+1]*.587+image.data[i+2]*.114;
        const value=gray>155?255:0;
        image.data[i]=image.data[i+1]=image.data[i+2]=value;
      }
      ctx.putImageData(image,0,0);
    }
    return canvas;
  }

  function extractScore(text){
    const normalized=text.replace(/[|]/g,"I").replace(/\s+/g," ");
    const patterns=[
      /(?:score|sc0re|sco re|points?|total)\s*[:：#-]?\s*([0-9][0-9,]*)/i,
      /([0-9][0-9,]*)\s*(?:score|points?)/i
    ];
    for(const pattern of patterns){
      const match=normalized.match(pattern);
      if(match){
        const value=Number(match[1].replace(/,/g,""));
        if(Number.isSafeInteger(value)&&value>=0&&value<=1000000000)return value;
      }
    }
    // Never submit a random number from the game screen without a score label.
    return null;
  }

  async function submitDetectedScore(score){
    if(score===lastSubmittedScore)return;
    const name=window.ArcadeScores && window.ArcadeScores.getPlayerName
      ? window.ArcadeScores.getPlayerName("Enter your name for the Stacktris leaderboard (24 characters max):")
      : "";
    if(!name){setStatus("score "+score+" detected; name entry cancelled");return;}
    setStatus("submitting score "+score+"…");
    const ok=await window.ArcadeScores.submit("Stacktris",score,name);
    if(ok){lastSubmittedScore=score;setStatus("score submitted: "+score);}
    else{setStatus("score "+score+" detected, but submission failed");}
  }

  async function scan(){
    if(scanning||Date.now()-lastOcrAt<2500)return;
    scanning=true; lastOcrAt=Date.now();
    try{
      let doc;
      try{doc=frame.contentDocument;}catch(_){setStatus("game frame is not accessible");return;}
      if(!doc){setStatus("waiting for game frame");return;}
      const canvas=doc.getElementById("canvas");
      if(!canvas||!canvas.width||!canvas.height){setStatus("waiting for game canvas");return;}
      if(!window.Tesseract){setStatus("score reader did not load");return;}
      if(!worker){setStatus("loading full-screen score reader…");worker=await Tesseract.createWorker("eng",1);}
      await worker.setParameters({tessedit_pageseg_mode:"11",preserve_interword_spaces:"1"});
      let result=await worker.recognize(prepareCanvas(canvas,false));
      let text=(result.data.text||"").replace(/\s+/g," ").trim();
      let score=extractScore(text);
      if(score===null){
        await worker.setParameters({tessedit_pageseg_mode:"11"});
        result=await worker.recognize(prepareCanvas(canvas,true));
        const retryText=(result.data.text||"").replace(/\s+/g," ").trim();
        if(retryText.length>text.length)text=retryText;
        score=extractScore(text);
      }
      if(text!==lastText){lastText=text;console.debug("Stacktris full-screen OCR:",text);}
      if(score===null){
        candidateScore=null;candidateCount=0;
        setStatus("scanning full screen; waiting for a labeled score");
        return;
      }
      if(score===candidateScore)candidateCount++;
      else{candidateScore=score;candidateCount=1;}
      if(candidateCount<2){
        setStatus("score "+score+" detected; confirming…");
        return;
      }
      if(score===lastSubmittedScore){setStatus("score already submitted: "+score);return;}
      await submitDetectedScore(score);
    }catch(error){
      console.warn("Stacktris score recognition failed:",error);
      setStatus("scanner error: "+String(error.message||error).slice(0,100));
    }finally{scanning=false;}
  }
  frame.addEventListener("load",()=>setStatus("game loaded; scanning entire screen"));
  setInterval(scan,700);
  scan();
})();
</script>
</body>
</html>
