<!DOCTYPE html>
<html>
	<head>
		<title>Stacktris</title>
		
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" type="text/css" href="index.css">
		
		<script src="src/third-party/pixi.min.js"></script>
		<script src="src/third-party/Box2dWeb-2.1.a.3.min.js"></script>
		
		<script src="src/asdf.js"></script>
		<script src="src/easd.js"></script>
		<script src="src/qasd.js"></script>
		<script src="src/qwas.js"></script>
		<script src="src/wasd.js"></script>
		<script src="../../js/arcade-score-config.js"></script>
		<script src="../../js/arcade-scores.js"></script>
		<script src="src/stacktris.js"></script>
		<script>
			(function() {
				var playerName = "";
				var bestSubmitted = 0;
				var nameAsked = false;
				window.updateStacktrisScore = async function(score) {
					var display = document.getElementById("stacktris-score");
					if (display) display.textContent = "Pieces placed: " + score;
					if (!window.ArcadeScores || score <= bestSubmitted) return;
					if (!playerName) {
						if (nameAsked) return;
						nameAsked = true;
						try { playerName = localStorage.getItem("arcadePlayerName") || ""; } catch (e) {}
						if (!playerName) {
							playerName = window.prompt("Enter your name for the leaderboard (24 characters max):", "");
							if (!playerName || !playerName.trim()) { playerName = ""; return; }
							playerName = playerName.trim().slice(0, 24);
							try { localStorage.setItem("arcadePlayerName", playerName); } catch (e) {}
						}
					}
					if (score <= bestSubmitted) return;
					var submitted = await window.ArcadeScores.submit("Stacktris", score, playerName);
					if (submitted) {
						bestSubmitted = score;
						if (display) display.textContent = "Pieces placed: " + score + " • Saved!";
					}
				};
			})();
		</script>
	</head>
	<body>
		<h1>Stacktris</h1>
		<p>by <a href="http://eternalvoid.net">Jeremy Carter</a> <a href="mailto:Jeremy@JeremyCarter.ca">Jeremy@JeremyCarter.ca</a> 2016</p>
		<p id="stacktris-score" aria-live="polite">Pieces placed: 0</p>
		<p><a href="https://github.com/defcronyke/stacktris">Source Code</a></p>
	</body>
</html>
