<!DOCTYPE html>
<html>
	<head>
		<title>Stacktris</title>
		
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" type="text/css" href="index.css">
		
		<script src="src/third-party/pixi.min.js"></script>
		<script src="src/third-party/Box2dWeb-2.1.a.3.min.js"></script>
		
		<script src="src/asdf.js"></script>
		<script src="src/easd.js"></script>
		<script src="src/qasd.js"></script>
		<script src="src/qwas.js"></script>
		<script src="src/wasd.js"></script>
		<script src="../../js/arcade-score-config.js"></script>
		<script src="../../js/arcade-scores.js"></script>
		<script src="src/stacktris.js"></script>
		<script>
			(function() {
				var playerName = "";
				var bestSubmitted = 0;
				var pendingScore = 0;
				var saving = false;
				var namePromptOpen = false;

				function getPlayerName() {
					if (playerName) return playerName;
					try { playerName = localStorage.getItem("arcadePlayerName") || ""; } catch (e) {}
					if (!playerName && !namePromptOpen) {
						namePromptOpen = true;
						var entered = window.prompt("Enter your name for the leaderboard (24 characters max):", "");
						namePromptOpen = false;
						if (entered && entered.trim()) {
							playerName = entered.trim().slice(0, 24);
							try { localStorage.setItem("arcadePlayerName", playerName); } catch (e) {}
						}
					}
					return playerName;
				}

				async function saveLatestScore() {
					if (saving || !pendingScore) return;
					var name = getPlayerName();
					if (!name) return;
					saving = true;
					while (pendingScore > bestSubmitted) {
						var scoreToSave = pendingScore;
						var ok = await window.ArcadeScores.submit("Stacktris", scoreToSave, name);
						if (!ok) break;
						bestSubmitted = scoreToSave;
					}
					saving = false;
				}

				window.updateStacktrisScore = function(score) {
					var display = document.getElementById("stacktris-score");
					if (display) display.textContent = "Pieces stacked: " + score + (score > bestSubmitted ? " • Saving…" : " • Saved");
					if (!window.ArcadeScores || score <= bestSubmitted) return;
					pendingScore = Math.max(pendingScore, score);
					saveLatestScore();
				};
			})();
		</script>
	</head>
	<body>
		<h1>Stacktris</h1>
		<p>by <a href="http://eternalvoid.net">Jeremy Carter</a> <a href="mailto:Jeremy@JeremyCarter.ca">Jeremy@JeremyCarter.ca</a> 2016</p>
		<p id="stacktris-score" aria-live="polite">Pieces stacked: 0</p>
		<p><a href="https://github.com/defcronyke/stacktris">Source Code</a></p>
	</body>
</html>
