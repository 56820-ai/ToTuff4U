  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d18;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    .shell{height:100%;display:flex;flex-direction:column}
    header{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#101a2c;border-bottom:1px solid #263754}

    iframe{display:block;width:100%;height:100%;border:0;background:#000}

<body>
  <div class="shell">
    <header>
      <a href="../../index.html">← Arcade Atlas</a>
      <strong>SLOPE PLUS</strong>
      <span>Official version · Seeded Runs · Custom Games</span>
    </header>
    <main>
      <iframe
        src="https://coweggs.itch.io/slope-plus"
        title="Official Slope Plus game by coweggs"
        allow="autoplay; fullscreen; gamepad"
