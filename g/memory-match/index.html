<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match</title><style>body{margin:0;background:#0a0a1a;color:#fff;font:18px Arial;text-align:center;padding:24px}h1{color:#ff6b9d}canvas{max-width:95vw;background:#111827;border:2px solid #6b9dff;border-radius:12px}button{cursor:pointer;border:0;border-radius:10px;padding:12px;background:#6b9dff;color:white}</style></head><body><h1>Memory Match</h1><div id="g"></div><p>Find all matching pairs.</p><script>let vals=['🍎','🍌','🍇','🍒','🍉','🥝','🍍','🍑'],deck=[...vals,...vals].sort(()=>Math.random()-.5),open=[],done=[];function draw(){g.innerHTML='';deck.forEach((v,i)=>{let b=document.createElement('button');b.textContent=done.includes(i)||open.includes(i)?v:'❔';b.style='font-size:32px;width:75px;height:75px;margin:5px';b.onclick=()=>{if(open.length<2&&!done.includes(i)){open.push(i);draw();if(open.length===2)setTimeout(()=>{if(deck[open[0]]===deck[open[1]])done.push(...open);open=[];draw();if(done.length===16)alert('You win!')},650)}};g.append(b)})}draw()</script><p><a href="../../" style="color:#6b9dff">← Back to games</a></p></body></html>
