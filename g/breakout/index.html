<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Breakout</title>
  <link rel="stylesheet" href="breakout.css">
  <style>
    html,body{min-height:100%;background:#171717}
    body{padding:12px 0 24px;box-sizing:border-box}
    #breakout{max-width:calc(100vw - 20px)!important;height:auto!important}
    #canvas{width:100%!important;height:auto!important;aspect-ratio:4/3;touch-action:none}
    #levels,#controls{z-index:2}
    .atlas-back{display:block;text-align:center;margin:14px auto;color:#ddd;font:14px Arial}
  </style>
  <script src="../../js/arcade-score-config.js"></script>
  <script src="../../js/arcade-scores.js"></script>
</head>
<body>
  <div id="breakout">
    <canvas id="canvas"><div class="unsupported">Your browser does not support HTML5 canvas.</div></canvas>
    <div id="levels">
      <img id="next" class="disabled" src="https://raw.githubusercontent.com/jakesgordon/javascript-breakout/master/images/up.png" title="next level" alt="Next level">
      <img id="prev" class="disabled" src="https://raw.githubusercontent.com/jakesgordon/javascript-breakout/master/images/down.png" title="previous level" alt="Previous level">
      <span id="label">level:</span><span id="level"></span>
    </div>
    <div id="controls"><input id="sound" type="checkbox"><label for="sound">sound</label></div>
    <div id="instructions" style="display:none">
      <div class="keyboard"><b>space</b> to start<br><b>left/right</b> to move paddle<br><b>up/down</b> to change level</div>
      <div class="touch"><b>touch here</b> to start<br><b>drag</b> paddle to move</div>
    </div>
  </div>
  <a class="atlas-back" href="../../">← Back to Arcade Atlas</a>
  <script src="game.js"></script>
  <script src="breakout.js"></script>
  <script src="levels.js"></script>
  <script>Game.ready(function(){ Game.start('canvas', Breakout); });</script>
</body>
</html>
