<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breakout</title><style>body{margin:0;background:#0a0a1a;color:#fff;font:18px Arial;text-align:center;padding:24px}h1{color:#ff6b9d}canvas{max-width:95vw;background:#111827;border:2px solid #6b9dff;border-radius:12px}button{cursor:pointer;border:0;border-radius:10px;padding:12px;background:#6b9dff;color:white}</style></head><body><h1>Breakout</h1><canvas id="c" width="480" height="360"></canvas><p>Move mouse or use ← →. Clear the bricks!</p><script src="../../js/arcade-score-config.js"></script><script src="../../js/arcade-scores.js"></script><script>let score=0,c=document.querySelector('#c'),x=c.getContext('2d'),p=210,b=[240,300,4,4],v=[3,-3],br=Array.from({length:5*8},(_,i)=>[i%8*58+8,(i/8|0)*24+20,1]);c.onmousemove=e=>p=e.offsetX-40;onkeydown=e=>{if(e.key==='ArrowLeft')p-=25;if(e.key==='ArrowRight')p+=25};function draw(){x.fillStyle='#111827';x.fillRect(0,0,480,360);br.forEach(q=>{if(q[2]){x.fillStyle='#7c5cff';x.fillRect(q[0],q[1],50,16)}});x.fillStyle='#fff';x.fillRect(p,335,80,10);x.beginPath();x.arc(b[0],b[1],7,0,7);x.fill();b[0]+=v[0];b[1]+=v[1];if(b[0]<7||b[0]>473)v[0]*=-1;if(b[1]<7)v[1]*=-1;if(b[1]>325&&b[0]>p&&b[0]<p+80)v[1]*=-1;br.forEach(q=>{if(q[2]&&b[0]>q[0]&&b[0]<q[0]+50&&b[1]>q[1]&&b[1]<q[1]+16){q[2]=0;score+=10;v[1]*=-1}});if(b[1]>360){if(window.ArcadeScores)window.ArcadeScores.promptAndSubmit('Breakout',score);alert('Game over! Score: '+score);location.reload()}requestAnimationFrame(draw)}draw()</script><p><a href="../../" style="color:#6b9dff">← Back to games</a></p></body></html>
