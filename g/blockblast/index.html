    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }
	 
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/BlockBlast1.1-8.loader.js";
      var config = {
        dataUrl: buildUrl + "/BlockBlast1.1-8.data.unityweb",
        frameworkUrl: buildUrl + "/BlockBlast1.1-8.framework.js.unityweb",
        codeUrl: buildUrl + "/BlockBlast1.1-8.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "reun",
        productName: "Block Blast Puzzle",
        productVersion: "1.1",
        showBanner: unityShowBanner,
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";

          // Best-effort leaderboard bridge for the Unity build. The game does
          // not expose its score to the hosting page, so watch saved browser
          // preferences for explicitly score-related numeric values.
          (function trackBlockBlastBestScore() {
            if (!window.ArcadeScores || !window.ArcadeScores.configured) return;
            var storageKey = "arcadeBlockBlastSubmittedBest";
            var submittedBest = Number(sessionStorage.getItem(storageKey) || 0);

            function numericValues(value, out, depth) {
              if (depth > 4 || value == null) return;
              if (typeof value === "number" && Number.isFinite(value)) {
                out.push(value);
              } else if (typeof value === "string") {
                var n = Number(value);
                if (value.trim() !== "" && Number.isFinite(n)) out.push(n);
                else {
                  try { numericValues(JSON.parse(value), out, depth + 1); } catch (e) {}
                }
              } else if (typeof value === "object") {
                Object.keys(value).forEach(function (key) {
                  if (/score|best|record|high/i.test(key)) numericValues(value[key], out, depth + 1);
                });
              }
            }

            function scanSavedScores() {
              var candidates = [];
              try {
                for (var i = 0; i < localStorage.length; i++) {
                  var key = localStorage.key(i);
                  if (!key || !/score|best|record|high/i.test(key)) continue;
                  numericValues(localStorage.getItem(key), candidates, 0);
                }
              } catch (e) {}
              var best = candidates.filter(function (n) {
                return Number.isSafeInteger(n) && n >= 1 && n <= 100000000;
              }).reduce(function (a, b) { return Math.max(a, b); }, 0);

              if (best > submittedBest) {
                submittedBest = best;
                try { sessionStorage.setItem(storageKey, String(best)); } catch (e) {}
                window.ArcadeScores.promptAndSubmit("Block Blast", best);
              }
            }

            scanSavedScores();
            window.setInterval(scanSavedScores, 1500);
            window.addEventListener("storage", scanSavedScores);
          })();
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
