    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {

	//  window.addEventListener("orientationchange", function () {

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }
	 
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/BlockBlast1.1-8.loader.js";
      var config = {
        dataUrl: buildUrl + "/BlockBlast1.1-8.data.unityweb",
        frameworkUrl: buildUrl + "/BlockBlast1.1-8.framework.js.unityweb",
        codeUrl: buildUrl + "/BlockBlast1.1-8.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "reun",
        productName: "Block Blast Puzzle",
        productVersion: "1.1",
        showBanner: unityShowBanner,
        // Keep the latest WebGL frame readable for canvas OCR.
        webglContextAttributes: { preserveDrawingBuffer: true },
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";

          // Visual score bridge: OCR the Unity canvas only after a likely
          // game-over screen appears. This avoids guessing from unrelated storage.
          (function connectBlockBlastCanvasOCR() {
            if (!window.ArcadeScores || !window.ArcadeScores.configured) return;
            var canvas = document.getElementById("unity-canvas");
            if (!canvas) return;
            var submittedBest = 0;
            try { submittedBest = Number(localStorage.getItem("arcadeBlockBlastSubmittedBest") || 0); } catch (e) {}
            var workerPromise = null;
            var scanning = false;
            var lastScreen = "";
            var lastSubmittedScreen = "";

            function getWorker() {
              if (!workerPromise) {
                workerPromise = window.Tesseract.createWorker("eng");
              }
              return workerPromise;
            }

            function normalize(text) {
              return String(text || "").toLowerCase().replace(/[^a-z0-9\s:]/g, " ").replace(/\s+/g, " ").trim();
            }

            function findScore(text) {
              var lines = String(text || "").split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
              var all = lines.join(" ");
              var patterns = [
                /(?:your\s+)?score\s*[:\-]?\s*([0-9][0-9,]{0,8})/i,
                /([0-9][0-9,]{0,8})\s*(?:points|pts)/i
              ];
              for (var i = 0; i < patterns.length; i++) {
                var match = all.match(patterns[i]);
                if (match) {
                  var n = Number(match[1].replace(/,/g, ""));
                  if (Number.isSafeInteger(n) && n > 0 && n <= 100000000) return n;
                }
              }
              for (var j = 0; j < lines.length; j++) {
                if (/\bscore\b/i.test(lines[j])) {
                  var nearby = (lines[j] + " " + (lines[j + 1] || "") + " " + (lines[j + 2] || "")).match(/[0-9][0-9,]{0,8}/);
                  if (nearby) {
                    var value = Number(nearby[0].replace(/,/g, ""));
                    if (Number.isSafeInteger(value) && value > 0 && value <= 100000000) return value;
                  }
                }
              }
              return 0;
            }

            function isGameOver(text) {
              var normalized = normalize(text);
              return /game\s*over|no\s*more\s*moves|out\s*of\s*moves|try\s*again|play\s*again/.test(normalized);
            }

            async function scanCanvas() {
              if (scanning || !window.Tesseract || !canvas.width || !canvas.height) return;
              scanning = true;
              try {
                var image = document.createElement("canvas");
                image.width = Math.max(1, Math.round(canvas.width * 0.8));
                image.height = Math.max(1, Math.round(canvas.height * 0.8));
                var ctx = image.getContext("2d", { willReadFrequently: true });
                ctx.drawImage(canvas, 0, 0, image.width, image.height);
                var result = await (await getWorker()).recognize(image);
                var text = result && result.data ? result.data.text : "";
                var normalized = normalize(text);
                if (!isGameOver(text)) {
                  lastScreen = "";
                  return;
                }
                var score = findScore(text);
                if (!score) return;
                var screenKey = normalized + "|" + score;
                if (screenKey === lastSubmittedScreen || score <= submittedBest) return;
                if (screenKey === lastScreen || !lastScreen) {
                  lastScreen = screenKey;
                  submittedBest = score;
                  lastSubmittedScreen = screenKey;
                  try { localStorage.setItem("arcadeBlockBlastSubmittedBest", String(score)); } catch (e) {}
                  await window.ArcadeScores.promptAndSubmit("Block Blast", score);
                } else {
                  lastScreen = screenKey;
                }
              } catch (error) {
                console.warn("Block Blast visual score detection failed:", error);
              } finally {
                scanning = false;
              }
            }

            // Load OCR lazily; it is only used for the Block Blast canvas.
            var ocrScript = document.createElement("script");
            ocrScript.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
            ocrScript.async = true;
            ocrScript.onload = function () {
              window.setInterval(scanCanvas, 2500);
            };
            ocrScript.onerror = function () {
              console.warn("Block Blast OCR library could not be loaded.");
            };
            document.head.appendChild(ocrScript);
          })();
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
