    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }
	 
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/BlockBlast1.1-8.loader.js";
      var config = {
        dataUrl: buildUrl + "/BlockBlast1.1-8.data.unityweb",
        frameworkUrl: buildUrl + "/BlockBlast1.1-8.framework.js.unityweb",
        codeUrl: buildUrl + "/BlockBlast1.1-8.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "reun",
        productName: "Block Blast Puzzle",
        productVersion: "1.1",
        showBanner: unityShowBanner,
        // Keep the latest WebGL frame readable for canvas OCR.
        webglContextAttributes: { preserveDrawingBuffer: true },
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";

          // Block Blast OCR leaderboard bridge.
          // Confetti is animated, so build a temporal-median frame to suppress
          // particles, then OCR only the central game-over panel.
          (function connectBlockBlastCanvasOCR() {
            if (!window.ArcadeScores || !window.ArcadeScores.configured) return;
            var gameCanvas = document.getElementById("unity-canvas");
            if (!gameCanvas) return;
            var workerPromise = null;
            var scanning = false;
            var gameOverHits = 0;
            var lastCandidate = 0;
            var candidateHits = 0;
            var submittedThisRun = false;
            var lastOcrAt = 0;

            function getWorker() {
              if (!workerPromise) workerPromise = window.Tesseract.createWorker("eng");
              return workerPromise;
            }
            function normalize(value) {
              return String(value || "").toLowerCase()
                .replace(/[^a-z0-9\s:]/g, " ").replace(/\s+/g, " ").trim();
            }
            function hasGameOver(text) {
              return /game\s*over|no\s*more\s*moves|out\s*of\s*moves|try\s*again|play\s*again|continue\s*playing/.test(normalize(text));
            }
            function readScore(text) {
              var lines = String(text || "").split(/\r?\n/).map(function(x) { return x.trim(); }).filter(Boolean);
              for (var i = 0; i < lines.length; i++) {
                var m = lines[i].match(/(?:your\s*)?score\s*[:\-]?\s*([0-9][0-9,]{0,8})/i);
                if (!m && /\bscore\b/i.test(lines[i])) {
                  m = (lines[i] + " " + (lines[i + 1] || "")).match(/[0-9][0-9,]{0,8}/);
                }
                if (m) {
                  var n = Number((m[1] || m[0]).replace(/,/g, ""));
                  if (Number.isSafeInteger(n) && n > 0 && n <= 100000000) return n;
                }
              }
              var all = lines.join(" ");
              var points = all.match(/([0-9][0-9,]{0,8})\s*(?:points|pts)/i);
              if (points) {
                var p = Number(points[1].replace(/,/g, ""));
                if (Number.isSafeInteger(p) && p > 0 && p <= 100000000) return p;
              }
              return 0;
            }
            function wait(ms) { return new Promise(function(resolve) { setTimeout(resolve, ms); }); }

            async function makeConfettiReducedCrop() {
              var w = gameCanvas.width, h = gameCanvas.height;
              if (!w || !h) return null;
              var sampleW = Math.min(540, w);
              var sampleH = Math.max(1, Math.round(h * sampleW / w));
              var frames = [];
              var buffer = document.createElement("canvas");
              buffer.width = sampleW; buffer.height = sampleH;
              var bctx = buffer.getContext("2d", { willReadFrequently: true });
              // Three snapshots: falling confetti changes position while the
              // fixed score/game-over text remains in the same place.
              for (var i = 0; i < 3; i++) {
                bctx.clearRect(0, 0, sampleW, sampleH);
                bctx.drawImage(gameCanvas, 0, 0, w, h, 0, 0, sampleW, sampleH);
                frames.push(bctx.getImageData(0, 0, sampleW, sampleH).data);
                if (i < 2) await wait(180);
              }
              var median = bctx.createImageData(sampleW, sampleH);
              for (var p = 0; p < median.data.length; p += 4) {
                for (var channel = 0; channel < 3; channel++) {
                  var a = frames[0][p + channel], b = frames[1][p + channel], d = frames[2][p + channel];
                  median.data[p + channel] = a > b ? (b > d ? b : (a > d ? d : a)) :
                    (a > d ? a : (b > d ? d : b));
                }
                median.data[p + 3] = 255;
              }
              bctx.putImageData(median, 0, 0);

              // Block Blast's end panel is central. Exclude much of the board
              // edge and surrounding confetti, while retaining the score panel.
              var crop = document.createElement("canvas");
              crop.width = 900; crop.height = 1200;
              var ctx = crop.getContext("2d", { willReadFrequently: true });
              var sx = Math.round(sampleW * 0.08);
              var sy = Math.round(sampleH * 0.18);
              var sw = Math.max(1, Math.round(sampleW * 0.84));
              var sh = Math.max(1, Math.round(sampleH * 0.64));
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = "high";
              ctx.drawImage(buffer, sx, sy, sw, sh, 0, 0, crop.width, crop.height);
              // Grayscale and mild contrast boost improves white score text.
              var pixels = ctx.getImageData(0, 0, crop.width, crop.height);
              for (var k = 0; k < pixels.data.length; k += 4) {
                var gray = pixels.data[k] * 0.299 + pixels.data[k + 1] * 0.587 + pixels.data[k + 2] * 0.114;
                var boosted = gray < 90 ? 0 : gray > 190 ? 255 : (gray - 90) * 2.55;
                pixels.data[k] = pixels.data[k + 1] = pixels.data[k + 2] = boosted;
              }
              ctx.putImageData(pixels, 0, 0);
              return crop;
            }

            async function scan() {
              if (scanning || !window.Tesseract || !gameCanvas.width || !gameCanvas.height) return;
              scanning = true;
              try {
                var crop = await makeConfettiReducedCrop();
                if (!crop) return;
                var worker = await getWorker();
                await worker.setParameters({
                  tessedit_pageseg_mode: "11",
                  preserve_interword_spaces: "1"
                });
                var result = await worker.recognize(crop);
                var text = result && result.data ? result.data.text : "";
                var ended = hasGameOver(text);
                if (!ended) {
                  gameOverHits = 0;
                  candidateHits = 0;
                  lastCandidate = 0;
                  submittedThisRun = false;
                  return;
                }
                gameOverHits++;
                var score = readScore(text);
                if (!score || submittedThisRun) return;
                if (score === lastCandidate) candidateHits++;
                else { lastCandidate = score; candidateHits = 1; }

                // Require two matching readings on separate scans to avoid
                // submitting confetti artifacts or a transient OCR misread.
                if (gameOverHits >= 2 && candidateHits >= 2) {
                  submittedThisRun = true;
                  var ok = await window.ArcadeScores.promptAndSubmit("Block Blast", score);
                  if (!ok) submittedThisRun = false;
                }
              } catch (error) {
                console.warn("Block Blast OCR leaderboard error:", error);
              } finally {
                scanning = false;
              }
            }

            var ocrScript = document.createElement("script");
            ocrScript.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
            ocrScript.async = true;
            ocrScript.onload = function() {
              // Scan infrequently so OCR does not interrupt the puzzle gameplay.
              window.setInterval(scan, 3000);
            };
            ocrScript.onerror = function() {
              console.warn("Block Blast OCR library could not be loaded.");
            };
            document.head.appendChild(ocrScript);
          })();
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
