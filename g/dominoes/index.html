<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-site-verification" content="uBDEapMmF1jmMtAC2MZve959FPIf4xm0gGhv3RCUUpA">
<meta name="google-adsense-account" content="ca-pub-8390067368864065">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8390067368864065" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dominoes · Arcade Atlas</title>
<meta name="description" content="Play classic block dominoes free in your browser: a double-six set against the computer, with drawing, passing and lowest-pip scoring.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🁣</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 30% 0%,#1e3a2b 0%,#0f2318 55%,#07110c 100%);
    color:#eef4fb;display:flex;flex-direction:column;align-items:center;justify-content:center;
    justify-content:safe center;min-height:100vh;min-height:100svh;padding:10px 8px 14px;user-select:none}
  .shell{width:min(860px,100%);display:flex;flex-direction:column;gap:9px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-weight:800;font-size:15px}
  .brand span{color:#8fe0a8}
  .back{font-size:12px;font-weight:700;text-decoration:none;color:#eef4fb;padding:9px 12px;border-radius:9px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
  .panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;
    padding:13px;display:flex;flex-direction:column;gap:10px;box-shadow:0 22px 60px rgba(0,0,0,.55)}
  .pillrow{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .pill{background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.12);border-radius:9px;
    padding:6px 11px;font-size:10px;color:#b9d6c2;text-transform:uppercase;letter-spacing:.06em}
  .pill b{color:#fff;font-size:13px;margin-left:5px;letter-spacing:0}
  .board{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:13px;
    padding:10px;overflow-x:auto;overflow-y:hidden}
  .chain{display:flex;gap:3px;align-items:center;min-height:64px;justify-content:center;min-width:100%}
  .chain .empty{color:#7f9b88;font-size:12px}
  .tile{background:#f4f1e4;border-radius:5px;box-shadow:0 2px 0 #b4ae97,0 3px 8px rgba(0,0,0,.45);
    display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;color:#1e2a22}
  .tile.v{width:30px;height:60px}
  .tile.h{width:60px;height:30px;flex-direction:row}
  .half{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    padding:3px;gap:1px;position:relative}
  .half+.half{border-top:1px solid #a9a390}
  .tile.h .half+.half{border-top:0;border-left:1px solid #a9a390}
  .pip{width:4px;height:4px;border-radius:50%;background:#1e2a22;justify-self:center;align-self:center}
  .hands{display:flex;flex-direction:column;gap:7px}
  .handrow{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-height:26px}
  .handlabel{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#9fb8a8;min-width:78px}
  .slot{width:26px;height:26px;border-radius:5px;background:rgba(244,241,228,.85);box-shadow:0 2px 0 #b4ae97}
  .tile.playable{cursor:pointer;outline:2px solid #8fe0a8;outline-offset:1px}
  .tile.playable:hover{transform:translateY(-2px)}
  .status{min-height:20px;text-align:center;font-size:13px;color:#b9d6c2}
  .status.good{color:#7ee2a8}.status.bad{color:#ff9b9b}
  .bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .btn{min-height:40px;padding:0 16px;border-radius:9px;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.08);color:#eef4fb;font:700 12px inherit;cursor:pointer}
  .btn:hover:not(:disabled){background:rgba(255,255,255,.17)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:#1b6b46;border-color:#8fe0a8}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">🁣 DOMINOES <span>·</span> Arcade Atlas</div>
    <a class="back" href="../../">← Arcade Atlas</a>
  </div>

  <div class="panel">
    <div class="pillrow">
      <div class="pill">Boneyard<b id="boneyard">14</b></div>
      <div class="pill">Computer<b id="aipips">0</b></div>
      <div class="pill">Your pips<b id="mypips">0</b></div>
      <div class="pill">Wins<b id="wins">0</b></div>
    </div>

    <div class="board"><div class="chain" id="chain"><span class="empty">Play a double to start, or draw.</span></div></div>

    <div class="hands">
      <div class="handrow"><span class="handlabel">Computer</span><div id="aihand" style="display:flex;gap:4px;flex-wrap:wrap"></div></div>
      <div class="handrow"><span class="handlabel">Your hand</span><div id="myhand" style="display:flex;gap:5px;flex-wrap:wrap"></div></div>
    </div>

    <div class="status" id="status" role="status" aria-live="polite">Your move.</div>
    <div class="bar">
      <button class="btn primary" type="button" id="draw">Draw tile</button>
      <button class="btn" type="button" id="pass">Pass</button>
      <button class="btn" type="button" id="new">New game</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const STORE = "arcadeAtlasDominoes";
  const PIPS = {
    0: [],
    1: [[2, 2]],
    2: [[1, 1], [3, 3]],
    3: [[1, 1], [2, 2], [3, 3]],
    4: [[1, 1], [1, 3], [3, 1], [3, 3]],
    5: [[1, 1], [1, 3], [2, 2], [3, 1], [3, 3]],
    6: [[1, 1], [1, 3], [2, 1], [2, 3], [3, 1], [3, 3]]
  };

  const chainEl = document.getElementById("chain");
  const handEl = document.getElementById("myhand");
  const aiEl = document.getElementById("aihand");
  const statusEl = document.getElementById("status");

  let hand = [];
  let aiHand = [];
  let boneyard = [];
  let chain = [];
  let turn = "player";
  let over = false;
  let busy = false;
  let wins = 0;

  function setStatus(text, cls) {
    statusEl.className = "status" + (cls ? " " + cls : "");
    statusEl.textContent = text;
  }
  function readWins() {
    try { return parseInt(localStorage.getItem(STORE), 10) || 0; } catch (e) { return 0; }
  }
  function writeWins(v) {
    try { localStorage.setItem(STORE, String(v)); } catch (e) { /* storage may be blocked */ }
  }
  function pips(tile) { return tile[0] + tile[1]; }
  function setPips(tile) { return tile[0] === tile[1]; }
  function key(tile) { return tile[0] + "-" + tile[1]; }

  function fullSet() {
    const set = [];
    for (let a = 0; a <= 6; a++) for (let b = a; b <= 6; b++) set.push([a, b]);
    return set;
  }
  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function halfEl(value) {
    const half = document.createElement("div");
    half.className = "half";
    const spots = PIPS[value];
    if (!spots.length) return half;
    spots.forEach(([row, col]) => {
      const pip = document.createElement("span");
      pip.className = "pip";
      pip.style.gridRow = row;
      pip.style.gridColumn = col;
      half.appendChild(pip);
    });
    return half;
  }

  function tileEl(tile, horizontal) {
    const el = document.createElement("div");
    el.className = "tile " + (horizontal ? "h" : "v");
    el.appendChild(halfEl(tile[0]));
    el.appendChild(halfEl(tile[1]));
    return el;
  }

  function ends() {
    if (!chain.length) return { left: null, right: null };
    return { left: chain[0][0], right: chain[chain.length - 1][1] };
  }

  function canPlay(tile) {
    if (!chain.length) return true;
    const e = ends();
    return tile[0] === e.left || tile[1] === e.left || tile[0] === e.right || tile[1] === e.right;
  }

  function place(tile) {
    if (!chain.length) { chain.push([tile[0], tile[1]]); return; }
    const e = ends();
    if (tile[1] === e.left) chain.unshift([tile[0], tile[1]]);
    else if (tile[0] === e.left) chain.unshift([tile[1], tile[0]]);
    else if (tile[0] === e.right) chain.push([tile[0], tile[1]]);
    else chain.push([tile[1], tile[0]]);
  }

  function paintChain() {
    chainEl.innerHTML = "";
    if (!chain.length) {
      const msg = document.createElement("span");
      msg.className = "empty";
      msg.textContent = "Play a tile to start the line.";
      chainEl.appendChild(msg);
      return;
    }
    chain.forEach((tile) => chainEl.appendChild(tileEl(tile, true)));
  }

  function paintHands() {
    handEl.innerHTML = "";
    hand
      .slice()
      .sort((a, b) => pips(b) - pips(a))
      .forEach((tile) => {
        const el = tileEl(tile, false);
        if (turn === "player" && !over && canPlay(tile)) {
          el.classList.add("playable");
          el.setAttribute("role", "button");
          el.setAttribute("aria-label", "Play " + key(tile));
          el.addEventListener("click", () => playerPlay(tile));
        }
        handEl.appendChild(el);
      });

    aiEl.innerHTML = "";
    aiHand.forEach(() => {
      const slot = document.createElement("div");
      slot.className = "slot";
      aiEl.appendChild(slot);
    });

    const e = ends();
    document.getElementById("boneyard").textContent = String(boneyard.length);
    document.getElementById("aipips").textContent = String(aiHand.reduce((s, t) => s + pips(t), 0));
    document.getElementById("mypips").textContent = String(hand.reduce((s, t) => s + pips(t), 0));
    document.getElementById("wins").textContent = String(wins);
    document.getElementById("draw").disabled = over || turn !== "player" || !boneyard.length;
    document.getElementById("pass").disabled = over || turn !== "player" || boneyard.length > 0 ||
      hand.some((t) => canPlay(t));
    void e;
  }

  function paintAll() {
    paintChain();
    paintHands();
  }

  function playerPlay(tile) {
    if (over || turn !== "player" || busy) return;
    const i = hand.findIndex((t) => key(t) === key(tile));
    if (i < 0 || !canPlay(tile)) return;
    hand.splice(i, 1);
    place(tile);
    paintAll();
    if (!hand.length) return finish("win", "You played every tile — you win!");
    turn = "ai";
    setStatus("Computer is thinking…");
    paintHands();
    setTimeout(aiTurn, 620);
  }

  function aiTurn() {
    if (over) return;
    let tileIndex = aiHand.findIndex((t) => canPlay(t));
    while (tileIndex < 0 && boneyard.length) {
      aiHand.push(boneyard.pop());
      tileIndex = aiHand.findIndex((t) => canPlay(t));
    }
    if (tileIndex < 0) {
      turn = "player";
      paintAll();
      if (!hand.some((t) => canPlay(t)) && !boneyard.length) return blocked();
      setStatus("Computer passes. Your move.");
      return;
    }
    // Prefer the highest-value playable tile so the computer keeps a lean hand.
    const playable = aiHand.filter((t) => canPlay(t));
    playable.sort((a, b) => pips(b) - pips(a));
    const choice = playable[0];
    aiHand.splice(aiHand.findIndex((t) => key(t) === key(choice)), 1);
    place(choice);
    paintAll();
    if (!aiHand.length) return finish("lose", "The computer used all its tiles. You lose this round.");
    turn = "player";
    paintAll();
    setStatus(hand.some((t) => canPlay(t)) ? "Your move." : (boneyard.length ? "No match — draw a tile." : "No match — pass."));
  }

  function drawTile() {
    if (over || turn !== "player" || !boneyard.length) return;
    hand.push(boneyard.pop());
    paintHands();
    if (!hand.some((t) => canPlay(t))) {
      setStatus(boneyard.length ? "Still no match — draw again." : "No match and the boneyard is empty. Pass.", "bad");
    } else {
      setStatus("Drew a tile. Play a matching tile.");
    }
    if (!boneyard.length && !hand.some((t) => canPlay(t))) {
      document.getElementById("pass").disabled = false;
    }
  }

  function pass() {
    if (over || turn !== "player" || boneyard.length) return;
    if (hand.some((t) => canPlay(t))) {
      setStatus("You have a playable tile.", "bad");
      return;
    }
    turn = "ai";
    paintHands();
    setStatus("You pass. Computer is thinking…");
    setTimeout(aiTurn, 620);
  }

  function blocked() {
    const mine = hand.reduce((s, t) => s + pips(t), 0);
    const theirs = aiHand.reduce((s, t) => s + pips(t), 0);
    if (mine < theirs) finish("win", "Board blocked. You have " + mine + " pips, computer has " + theirs + " — you win!");
    else if (mine > theirs) finish("lose", "Board blocked. You have " + mine + " pips, computer has " + theirs + " — computer wins.");
    else finish("draw", "Board blocked and both hands total " + mine + " pips. It's a draw.");
  }

  function finish(result, message) {
    over = true;
    turn = null;
    paintAll();
    if (result === "win") {
      wins = readWins() + 1;
      writeWins(wins);
      document.getElementById("wins").textContent = String(wins);
      setStatus(message, "good");
    } else if (result === "draw") {
      setStatus(message);
    } else {
      setStatus(message, "bad");
    }
  }

  function newGame() {
    const set = shuffle(fullSet());
    hand = set.splice(0, 7).map((t) => t.slice());
    aiHand = set.splice(0, 7).map((t) => t.slice());
    boneyard = set.map((t) => t.slice());
    chain = [];
    over = false;
    busy = false;
    wins = readWins();
    // Whoever holds the highest double opens; the player always starts for pace.
    turn = "player";
    paintAll();
    const opener = hand.slice().sort((a, b) => pips(b) - pips(a))[0];
    setStatus("Your move — try " + key(opener) + " or any tile on the ends.");
  }

  document.getElementById("draw").addEventListener("click", drawTile);
  document.getElementById("pass").addEventListener("click", pass);
  document.getElementById("new").addEventListener("click", newGame);

  newGame();
})();
</script>
</body>
</html>
