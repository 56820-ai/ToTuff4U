<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reaction Test</title><style>body{margin:0;background:#0a0a1a;color:#fff;font:18px Arial;text-align:center;padding:24px}h1{color:#ff6b9d}canvas{max-width:95vw;background:#111827;border:2px solid #6b9dff;border-radius:12px}button{cursor:pointer;border:0;border-radius:10px;padding:12px;background:#6b9dff;color:white}</style></head><body><h1>Reaction Test</h1><button id="b" style="width:100%;height:280px;font-size:28px;background:#6b9dff;color:white;border:0;border-radius:20px">Click to start</button><p id="r">Wait for green, then click as fast as you can.</p><script src="../../js/arcade-score-config.js"></script><script src="../../js/arcade-scores.js"></script><script>let b=document.querySelector('#b'),r=document.querySelector('#r'),start,wait=false,ready=false,timer=null;b.onclick=()=>{if(!wait&&!ready){wait=true;b.style.background='#ff6b9d';b.textContent='Wait...';timer=setTimeout(()=>{ready=true;start=performance.now();b.style.background='#43e6a2';b.textContent='CLICK!'},1000+Math.random()*3000)}else if(ready){let ms=Math.max(0,Math.round(performance.now()-start));r.textContent='Your reaction: '+ms+' ms';if(window.ArcadeScores)window.ArcadeScores.promptAndSubmit('Reaction Test',Math.max(0,10000-ms));wait=ready=false;timer=null;b.style.background='#6b9dff';b.textContent='Try again'}else if(wait){clearTimeout(timer);timer=null;r.textContent='Too soon!';wait=ready=false;b.textContent='Try again';b.style.background='#6b9dff'}}</script><p><a href="../../" style="color:#6b9dff">← Back to games</a></p></body></html>
