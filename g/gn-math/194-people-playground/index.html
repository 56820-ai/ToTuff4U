  <body>
    <div id="xp-loader">
      <div id="xp-loader-title">Loading..</div>
      <div id="xp-loader-bar"><div id="xp-loader-fill"></div></div>
      <div id="xp-loader-text">0%</div>
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-warning"></div>
    </div>
    <script>
      window.fileMergerConfig = {
        files: [
          { name: 'pggbog.data', parts: 7 },
          { name: 'pggbog.wasm', parts: 3 }
        ],
        basePath: 'Build/',
        debug: true
      };  
  </script>
  <script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/merge.js"></script>
    <script>
var canvas = document.querySelector("#unity-canvas");
      var xpBox = document.querySelector("#xp-loader");
      var xpFill = document.querySelector("#xp-loader-fill");
      var xpText = document.querySelector("#xp-loader-text");
      var warningBanner = document.querySelector("#unity-warning");
      function showGameError(message) {
        xpBox.style.display = "flex";
        xpBox.style.zIndex = "10001";
        xpBox.style.width = "min(420px, calc(100vw - 48px))";
        xpBox.style.color = "#7f1d1d";
        xpBox.style.background = "#fff1f2";
        xpBox.style.borderColor = "#be123c";
        xpBox.innerHTML = '<div id="xp-loader-title">People Playground could not start</div><div style="font-size:13px;line-height:1.5;overflow-wrap:anywhere"></div><button id="ppg-retry" style="padding:9px 14px;cursor:pointer">Reload game</button>';
        xpBox.querySelector("div:nth-child(2)").textContent = String(message || "Unknown Unity loading error");
        xpBox.querySelector("#ppg-retry").addEventListener("click", function () { location.reload(); });
        console.error("[People Playground] Startup failed:", message);
      }
      canvas.addEventListener("webglcontextlost", function (event) {
        event.preventDefault();
        showGameError("The browser lost the WebGL graphics context. Reload the game or try enabling hardware acceleration.");
      });

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = "https://56820-ai.github.io/ToTuff4U/g/gn-math/194-people-playground/pggbog.loader.js";
      var config = {
        dataUrl: buildUrl + "/pggbog.data",
        frameworkUrl: "https://56820-ai.github.io/ToTuff4U/g/gn-math/194-people-playground/Build/pggbog.framework.js",
        codeUrl: buildUrl + "/pggbog.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Studio Minus",
        productName: "People Playground",
        productVersion: "1",
        showBanner: unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var p = Math.round(progress * 100);
          xpFill.style.width = p + "%";
          xpText.textContent = p + "%";
        }).then((unityInstance) => {
          xpBox.style.display = "none";
        }).catch((message) => {
          showGameError(message);
        });
      };
      script.onerror = function () {
        showGameError("The Unity loader script could not be downloaded. Check whether the game CDN is accessible, then reload.");
      };
      document.body.appendChild(script);
    </script>
  
</body>
