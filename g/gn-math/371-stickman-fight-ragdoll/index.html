  const base = document.baseURI;
  window.Worker = class ArcadeAtlasBaseWorker extends NativeWorker {
    constructor(url, options) {
      let target = url;
      if (typeof url === "string" && /^\/?scripts\/(?:c3runtime|jobworker|dispatchworker|workermain)\.js(?:[?#].*)?$/i.test(url)) {

      }
      super(target, options);
    }
  };
})();
