<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tetris</title>

	<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="tetris">
	<canvas id="scene"></canvas>
	<div id="gameOver">
		<h1>Game Over !</h1>
		<h3>Score: <span id="finalScore">0</span></h3>
		<h2><a href="#" id="restart">Restart</a></h2>
		
	</div>
	<div id="side">
		<div id="info">
			<h1 id="levelInfo">Level: <br><span id="level">1</span></h1>
			<h2 id="scoreInfo">Score: <br><span id="score" >0</span></h2>
			<div id="rewardInfo" class="invisible">+<span id="reward">0</span></div>
			<canvas id="preview"></canvas>
		</div>
	</div>
</div>


</body>
<script src="/js/arcade-score-config.js"></script>
<script src="/js/arcade-scores.js"></script>
<script src="dist/tetris.js"></script>
<script>
	(function(){
		var tetris = new Tetris('tetris');
		var originalUpdate = tetris._update;
		tetris._update = function () {
			originalUpdate.apply(this, arguments);
			if (this.isGameOver && !this._arcadeScoreSubmitted) {
				this._arcadeScoreSubmitted = true;
				if (window.ArcadeScores) window.ArcadeScores.promptAndSubmit('Tetris', this.score);
			}
		};
		tetris.start();
	})();
</script>
</html>
