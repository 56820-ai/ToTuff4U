<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake</title><style>body{margin:0;background:#0a0a1a;color:#fff;font:18px Arial;text-align:center;padding:24px}h1{color:#ff6b9d}canvas{max-width:95vw;background:#111827;border:2px solid #6b9dff;border-radius:12px}button{cursor:pointer;border:0;border-radius:10px;padding:12px;background:#6b9dff;color:white}</style></head><body><h1>Snake</h1><canvas id="c" width="420" height="420"></canvas><p>Arrow keys / WASD to move. Eat food and avoid yourself.</p><button onclick="start()">Restart</button><script>const c=document.querySelector('#c'),x=c.getContext('2d');let s,f,d,t;function start(){s=[[10,10],[9,10],[8,10]];d=[1,0];f=[15,15];t=setInterval(step,110)}onkeydown=e=>{let m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(m&&m[0]!==-d[0]&&m[1]!==-d[1])d=m};function step(){let h=[s[0][0]+d[0],s[0][1]+d[1]];if(h[0]<0||h[1]<0||h[0]>=21||h[1]>=21||s.some(p=>p[0]===h[0]&&p[1]===h[1])){clearInterval(t);alert('Game over! Length: '+s.length);return}s.unshift(h);if(h[0]===f[0]&&h[1]===f[1])f=[Math.random()*21|0,Math.random()*21|0];else s.pop();x.fillStyle='#101827';x.fillRect(0,0,420,420);x.fillStyle='#43e6a2';s.forEach(p=>x.fillRect(p[0]*20,p[1]*20,18,18));x.fillStyle='#ff668b';x.fillRect(f[0]*20,f[1]*20,18,18)}start()</script><p><a href="../../" style="color:#6b9dff">← Back to games</a></p></body></html>
