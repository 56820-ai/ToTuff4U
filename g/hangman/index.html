<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hangman · Arcade Atlas</title>
<meta name="description" content="Play Hangman free in your browser: pick letters to reveal a hidden word before the drawing is finished. Six categories, hints and a streak counter.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪢</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 85% 0%,#2a1f3d 0%,#101423 55%,#080c15 100%);
    color:#eef3fa;display:flex;flex-direction:column;align-items:center;justify-content:center;
    justify-content:safe center;min-height:100vh;min-height:100svh;padding:10px 10px 14px;user-select:none}
  .shell{width:min(620px,100%);display:flex;flex-direction:column;gap:10px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-weight:800;font-size:15px;letter-spacing:.02em}
  .brand span{color:#f0a500}
  .back{font-size:12px;font-weight:700;text-decoration:none;color:#eef3fa;padding:9px 12px;border-radius:9px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
  .back:hover{background:rgba(255,255,255,.12)}
  .panel{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:18px;
    padding:14px;box-shadow:0 22px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px}
  .stage{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
  svg{width:100%;height:auto;max-height:170px}
  .stats{display:flex;flex-direction:column;gap:8px}
  .stat{background:rgba(255,255,255,.06);border-radius:10px;padding:7px 10px;display:flex;
    justify-content:space-between;align-items:baseline;font-size:12px;color:#b8c6d8}
  .stat b{font-size:16px;color:#fff}
  .category{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#f0a500}
  .word{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;min-height:44px;align-items:center}
  .letter{width:30px;height:38px;border-bottom:3px solid rgba(255,255,255,.4);display:grid;place-items:center;
    font-weight:800;font-size:22px;text-transform:uppercase}
  .letter.shown{border-bottom-color:#4cc9f0;color:#dff6ff}
  .letter.space{width:14px;border-bottom:0}
  .keys{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
  .key{width:calc(9.09% - 5px);min-width:34px;min-height:44px;border-radius:8px;border:0;background:#28324a;
    color:#eef3fa;font:800 14px inherit;cursor:pointer;text-transform:uppercase;transition:background .15s}
  .key:hover:not(:disabled){background:#374563}
  .key:disabled{cursor:default;opacity:.85}
  .key.hit{background:#2f8f5b;opacity:1}
  .key.miss{background:#1b2231;color:#61708a;opacity:1}
  .status{min-height:20px;text-align:center;font-size:13px;color:#adc0d4}
  .status.good{color:#7ee2a8}
  .status.bad{color:#ff9b9b}
  .footer{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .btn{min-height:42px;padding:0 16px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);color:#eef3fa;font:700 13px inherit;cursor:pointer}
  .btn:hover{background:rgba(255,255,255,.13)}
  .btn.primary{background:#8a5a13;border-color:#f0a500}
  :focus-visible{outline:3px solid #f0a500;outline-offset:2px}
  @media (max-width:480px){.stage{grid-template-columns:1fr}.stage svg{max-height:120px;justify-self:center}
    .stats{flex-direction:row;flex-wrap:wrap}.stat{flex:1;min-width:90px;flex-direction:column;gap:2px}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">🪢 HANGMAN <span>·</span> Arcade Atlas</div>
    <a class="back" href="../../">← Arcade Atlas</a>
  </div>

  <div class="panel">
    <div class="stage">
      <svg viewBox="0 0 150 170" aria-hidden="true">
        <g stroke="#7f8ea6" stroke-width="5" stroke-linecap="round" fill="none">
          <line x1="16" y1="160" x2="110" y2="160"/>
          <line x1="42" y1="160" x2="42" y2="16"/>
          <line x1="42" y1="16" x2="104" y2="16"/>
          <line x1="104" y1="16" x2="104" y2="36"/>
        </g>
        <g id="draw" stroke="#f0a500" stroke-width="5" fill="none" stroke-linecap="round">
          <circle id="p-head" cx="104" cy="50" r="14" opacity="0"/>
          <line id="p-body" x1="104" y1="64" x2="104" y2="108" opacity="0"/>
          <line id="p-arm-l" x1="104" y1="76" x2="84" y2="94" opacity="0"/>
          <line id="p-arm-r" x1="104" y1="76" x2="124" y2="94" opacity="0"/>
          <line id="p-leg-l" x1="104" y1="108" x2="86" y2="136" opacity="0"/>
          <line id="p-leg-r" x1="104" y1="108" x2="122" y2="136" opacity="0"/>
        </g>
      </svg>
      <div class="stats">
        <div class="category" id="category">ANIMALS</div>
        <div class="stat"><span>Lives left</span><b id="lives">6</b></div>
        <div class="stat"><span>Streak</span><b id="streak">0</b></div>
        <div class="stat"><span>Best streak</span><b id="best">0</b></div>
      </div>
    </div>

    <div class="word" id="word" aria-label="Hidden word"></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="keys" id="keys"></div>

    <div class="footer">
      <button class="btn primary" type="button" id="next">Next word</button>
      <button class="btn" type="button" id="hint">Hint (−1 life)</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const CATEGORIES = {
    Animals: ["elephant", "penguin", "giraffe", "dolphin", "cheetah", "octopus", "raccoon", "gorilla", "tortoise", "kangaroo", "jellyfish", "hamster", "porcupine", "flamingo", "squirrel"],
    Food: ["spaghetti", "pancakes", "chocolate", "popcorn", "avocado", "broccoli", "lasagna", "pineapple", "cupcake", "burrito", "watermelon", "sandwich"],
    Sports: ["basketball", "volleyball", "skateboard", "gymnastics", "lacrosse", "swimming", "softball", "hockey", "surfing", "archery", "marathon", "wrestling"],
    School: ["homework", "locker", "principal", "cafeteria", "notebook", "science", "recess", "algebra", "backpack", "dictionary", "schedule", "laboratory"],
    Games: ["minecraft", "controller", "speedrun", "bossfight", "multiplayer", "arcade", "checkpoint", "powerup", "joystick", "leaderboard", "easteregg"],
    Space: ["astronaut", "asteroid", "telescope", "satellite", "jupiter", "gravity", "galaxy", "meteorite", "spaceship", "nebula", "saturn"]
  };
  const MAX_LIVES = 6;
  const PARTS = ["p-head", "p-body", "p-arm-l", "p-arm-r", "p-leg-l", "p-leg-r"];
  const STORE = "arcadeAtlasHangman";

  const wordEl = document.getElementById("word");
  const keysEl = document.getElementById("keys");
  const statusEl = document.getElementById("status");
  const categoryEl = document.getElementById("category");
  const livesEl = document.getElementById("lives");

  let answer = "";
  let guessed = new Set();
  let lives = MAX_LIVES;
  let done = false;

  function readStats() {
    try {
      return JSON.parse(localStorage.getItem(STORE)) || { streak: 0, best: 0, played: 0, won: 0 };
    } catch (e) {
      return { streak: 0, best: 0, played: 0, won: 0 };
    }
  }
  function writeStats(s) {
    try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) { /* storage may be blocked */ }
  }
  function paintStats() {
    const s = readStats();
    document.getElementById("streak").textContent = s.streak;
    document.getElementById("best").textContent = s.best;
  }

  function drawParts() {
    PARTS.forEach((id, i) => {
      document.getElementById(id).setAttribute("opacity", i < MAX_LIVES - lives ? "1" : "0");
    });
  }

  function buildKeys() {
    keysEl.innerHTML = "";
    "abcdefghijklmnopqrstuvwxyz".split("").forEach((ch) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "key";
      btn.textContent = ch;
      btn.dataset.key = ch;
      btn.addEventListener("click", () => guess(ch));
      keysEl.appendChild(btn);
    });
  }

  function paintWord() {
    wordEl.innerHTML = "";
    [...answer].forEach((ch) => {
      const cell = document.createElement("div");
      if (ch === " ") { cell.className = "letter space"; }
      else {
        const shown = guessed.has(ch);
        cell.className = "letter" + (shown ? " shown" : "");
        cell.textContent = shown ? ch : "";
      }
      wordEl.appendChild(cell);
    });
  }

  function setStatus(text, cls) {
    statusEl.className = "status" + (cls ? " " + cls : "");
    statusEl.textContent = text;
  }

  function startRound() {
    const names = Object.keys(CATEGORIES);
    const name = names[Math.floor(Math.random() * names.length)];
    const list = CATEGORIES[name];
    answer = list[Math.floor(Math.random() * list.length)];
    guessed = new Set();
    lives = MAX_LIVES;
    done = false;
    categoryEl.textContent = name.toUpperCase();
    livesEl.textContent = MAX_LIVES;
    buildKeys();
    paintWord();
    drawParts();
    setStatus("Pick a letter. " + answer.length + " letters.");
  }

  function useLife() {
    lives -= 1;
    livesEl.textContent = lives;
    drawParts();
    if (lives <= 0) finish(false);
  }

  function guess(ch) {
    if (done || guessed.has(ch)) return;
    const btn = keysEl.querySelector('[data-key="' + ch + '"]');
    guessed.add(ch);
    const hit = answer.includes(ch);
    if (btn) {
      btn.disabled = true;
      btn.classList.add(hit ? "hit" : "miss");
    }
    if (hit) {
      paintWord();
      if ([...answer].every((c) => c === " " || guessed.has(c))) finish(true);
    } else {
      useLife();
      if (!done) setStatus("No " + ch.toUpperCase() + " in this word.");
    }
  }

  function finish(won) {
    if (done) return;
    done = true;
    const s = readStats();
    s.played += 1;
    if (won) {
      s.won += 1;
      s.streak += 1;
      s.best = Math.max(s.best, s.streak);
    } else {
      s.streak = 0;
      wordEl.innerHTML = "";
      [...answer].forEach((ch) => {
        const cell = document.createElement("div");
        if (ch === " ") cell.className = "letter space";
        else { cell.className = "letter shown"; cell.textContent = ch; }
        wordEl.appendChild(cell);
      });
    }
    writeStats(s);
    paintStats();
    setStatus(won ? "Solved it with " + lives + " lives left!" : "Out of lives — the word was " + answer.toUpperCase() + ".", won ? "good" : "bad");
    document.getElementById("next").focus();
  }

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[a-zA-Z]$/.test(e.key)) guess(e.key.toLowerCase());
    else if (e.key === "Enter") { if (done) startRound(); }
  });

  document.getElementById("next").addEventListener("click", startRound);
  document.getElementById("hint").addEventListener("click", () => {
    if (done) { startRound(); return; }
    const remaining = [...new Set(answer)].filter((c) => c !== " " && !guessed.has(c));
    if (!remaining.length) return;
    // Reveal a random unrevealed letter at the cost of one life.
    useLife();
    if (done) return;
    const pick = remaining[Math.floor(Math.random() * remaining.length)];
    guessed.add(pick);
    const btn = keysEl.querySelector('[data-key="' + pick + '"]');
    if (btn) { btn.disabled = true; btn.classList.add("hit"); }
    paintWord();
    setStatus("Hint revealed " + pick.toUpperCase() + " for one life.");
    if ([...answer].every((c) => c === " " || guessed.has(c))) finish(true);
  });

  paintStats();
  startRound();
})();
</script>
</body>
</html>
