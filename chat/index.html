  <meta charset="UTF-8" />

  <style>
    #fullscreen-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      padding: 0.5rem 1rem;
      background: #222;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;

      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

      background: #444;

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8390067368864065"

<!-- Vertical Ad Type -->
<ins class="adsbygoogle"
     style="display:block"

     data-ad-slot="9531168719"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>

<button id="fullscreen-btn">Fullscreen</button>

<main style="max-width:900px;margin:48px auto;padding:32px;color:#f4f5ff;font:16px/1.6 system-ui,sans-serif;background:#15172a;border:1px solid #343858;border-radius:18px">
<h1 style="margin-top:0">Vortex Chat</h1>
<p>Vortex is an external chat service. Choose below when you want to open it. Arcade Atlas no longer automatically redirects this page or wraps the service in an iframe.</p>
<a href="https://vortexos.net/" rel="noopener noreferrer" style="display:inline-block;padding:12px 20px;border-radius:10px;background:#7167ff;color:white;text-decoration:none;font-weight:700">Open Vortex</a>
</main>
<script>document.getElementById('fullscreen-btn')?.addEventListener('click',()=>{const el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();});</script>

</body>
